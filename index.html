    // --- TEXT NORMALIZATION & LEVENSHTEIN FUZZY MATCHING ENGINE ---
    const normalizeText = (text) => {
      if (!text) return "";
      return text
        .toLowerCase()
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/[^\w\s]/gi, '')
        .replace(/\s+/g, ' ')
        .trim();
    };

    const levenshteinDistance = (a, b) => {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
            );
          }
        }
      }
      return matrix[b.length][a.length];
    };

    const isFuzzyMatch = (query, target) => {
      const q = normalizeText(query);
      const t = normalizeText(target);
      if (!q || !t) return false;
      if (t.includes(q) || q.includes(t)) return true;

      const qWords = q.split(' ');
      const tWords = t.split(' ');

      for (let qw of qWords) {
        if (qw.length < 3) continue;
        for (let tw of tWords) {
          if (tw.length < 3) continue;
          const maxDist = qw.length > 5 ? 2 : 1;
          if (levenshteinDistance(qw, tw) <= maxDist) return true;
        }
      }
      return false;
    };

    // Strict, distinctive-token firm matcher used for TIER decisions (search keeps the looser isFirmMatch).
    // Generic words ("Associates", "Legal", "Partners", "Advocates"...) are ignored, so they can never
    // cause one firm to be mistaken for another; every distinctive token of the shorter side must match
    // (typo tolerant) a token on the other side.
    const FIRM_GENERIC_TOKENS = new Set(["law","laws","legal","partners","partner","associates","associate","advocates","advocate","solicitors","solicitor","co","company","and","offices","office","chambers","llp","pvt","ltd","the","of","at","in","for","intern","internship","interned","firm","group","advisors","advisory","consulting","services","india","attorneys","practice","counsel","month","months","week","weeks","year","years","worked","working","stint","summer","winter"]);
    const firmTokens = (text) => normalizeText(text).split(" ").filter(w => w.length >= 3 && !FIRM_GENERIC_TOKENS.has(w));
    const tokenMatches = (a, b) => {
      if (a === b) return true;
      if (a.length >= 6 && b.length >= 6) return levenshteinDistance(a, b) <= (a.length >= 9 ? 2 : 1);
      return false;
    };
    const isFirmMatch = (query, target) => {
      const q = normalizeText(query), t = normalizeText(target);
      if (!q || !t) return false;
      if ((" " + t + " ").includes(" " + q + " ") || (" " + q + " ").includes(" " + t + " ")) return true;
      const qt = firmTokens(q), tt = firmTokens(t);
      if (qt.length === 0 || tt.length === 0) return false;
      const [small, large] = qt.length <= tt.length ? [qt, tt] : [tt, qt];
      return small.every(s => large.some(l => tokenMatches(s, l)));
    };

      { q: "A condition, as opposed to a warranty, in a contract for sale of goods is best distinguished by:", options: ["A condition going to the root of the contract, allowing rescission on breach", "A condition only ever applying to immovable property", "A warranty always being more valuable than a condition", "There being no legal distinction between the two"], answer: 0 },

      { q: "Hypothetical: Two friends orally agree to split the profits of a food cart business they run together, with no written deed. Is a partnership legally formed?", options: ["No, a partnership can only arise from a written and registered deed", "Yes, a partnership can arise from an oral agreement to share profits of a business", "No, at least one party must be a body corporate", "Yes, but only once the business earns its first profit"], answer: 1 },
      { q: "Which statute primarily governs the registration and protection of a distinctive word or logo used to identify goods or services?", options: ["The Patents Act, 1970", "The Trade Marks Act, 1999", "The Copyright Act, 1957", "The Designs Act, 2000"], answer: 1 },
      { q: "A moratorium under Section 14 of the IBC, once CIRP commences, primarily has the effect of:", options: ["Immediately liquidating the corporate debtor", "Suspending most suits and proceedings against the corporate debtor", "Discharging all of the debtor's directors from office", "Converting all debt into equity automatically"], answer: 1 },
      { q: "Hypothetical: A company's board approves a related-party transaction with a director's family-owned firm without shareholder approval. Which Companies Act provision is most directly implicated?", options: ["Section 149 (director appointment)", "Section 188 (related party transactions)", "Section 2(87) (subsidiary company definition)", "Section 96 (annual general meetings)"], answer: 1 },
      { q: "The 'arm's length price' standard in transfer pricing exists primarily to:", options: ["Fix a flat tax rate for all multinational transactions", "Test whether related-party pricing matches what independent parties would agree", "Determine GST applicability on exports", "Set customs duty on imported machinery"], answer: 1 },
      { q: "Under FEMA, which body is generally responsible for framing rules (as opposed to regulations) on capital account transactions involving non-debt instruments?", options: ["The Reserve Bank of India", "The Central Government", "SEBI", "The Ministry of Corporate Affairs"], answer: 1 },
      { q: "A 'take-or-pay' clause in a long-term supply or power agreement primarily obligates the buyer to:", options: ["Pay only for the quantity actually consumed", "Pay a minimum amount regardless of quantity actually taken", "Renegotiate price annually", "Terminate the agreement if demand falls"], answer: 1 },
      { q: "Hypothetical: A trademark applicant chooses a mark that simply describes the product's function (e.g. 'Fast Wash' for a detergent). What is the most likely examination hurdle?", options: ["No hurdle — descriptive marks are always registrable", "An objection on the ground the mark lacks distinctiveness", "Automatic registration due to first-to-file priority", "Rejection solely for being a foreign word"], answer: 1 },
      { q: "The difference between a financial creditor and an operational creditor under the IBC primarily turns on:", options: ["Whether the debt arose from a disbursement against consideration for time value of money", "Which court the creditor approaches first", "Whether the creditor is a foreign entity", "The size of the outstanding claim alone"], answer: 0 }
    ];

    // Practice-neutral score function for open-ended answers in the Qualification Test's Partner Round.
    const OPEN_ANSWER_ANCHORS = [
      "companies act", "fema", "sebi", "arbitration act", "ibc", "constitution", "nclt", "cci", "due diligence",
      "indemnity", "condition precedent", "condition subsequent", "disclosure", "clause", "warranty", "liability",
      "damages", "injunction", "seat", "venue", "arbitrator", "tribunal", "interim", "appeal", "jurisdiction",
      "rofr", "rofo", "sha", "aoa", "moa", "cirp", "coc", "ecb", "trademark", "patent", "moratorium"
    ];
    const scoreOpenAnswer = (answerText) => {
      const norm = normalizeText(answerText);
      const words = answerText.trim().split(/\s+/).filter(w => w.length > 0).length;
      let matched = 0;
      OPEN_ANSWER_ANCHORS.forEach(a => { if (norm.includes(a)) matched += 1; });
      let score = 30 + Math.min(matched, 4) * 12;
      if (words >= 80) score += 20;
      else if (words >= 40) score += 10;
      if (words < 10) score = Math.min(score, 25);
      return Math.max(10, Math.min(100, score));
    };

    // --- EXACT PARSING & READINESS SCORING ENGINE ---
    const parseProfile = (profile) => {
      const targetPractice = profile.targetPractice || "General Corporate";
      const firmTiersForPractice = PRACTICE_AREA_FIRM_TIERS[targetPractice] || PRACTICE_AREA_FIRM_TIERS["General Corporate"];

      // 1. Educational Qualifications (JGLS 8.0 Scale)
      const cgpa = parseFloat(profile.cgpa) || 0;
      let academicTier = "Not Tiered";
      let academicScore = 50;

      if (cgpa >= 7.50) { academicTier = "Tier 1"; academicScore = 90; }
      else if (cgpa >= 7.00) { academicTier = "Tier 2"; academicScore = 75; }
      else if (cgpa >= 6.90) { academicTier = "Tier 3"; academicScore = 65; }
      else { academicTier = "Not Tiered"; academicScore = 50; }

      const academicItems = [{ name: `CGPA ${cgpa.toFixed(2)} / 8.00`, tier: academicTier, score: academicScore }];

      // Helper function to split text area entries
      const splitEntries = (text) => {
        if (!text) return [];
        return text
          .split(/[\n;]/)
          .map(e => e.trim())
          .filter(e => e.length > 0);
      };

      // 2. Internships & Work Experience — tier matrix reacts to the SELECTED PRACTICE AREA.
      // Matching checks the practice-area tier lists FIRST and directly (typo/case/wording tolerant),
      // so boutique or specialist firms that only appear there (not in the generic company database)
      // are still correctly recognised — this is what a firm's tier is actually judged against.
      const rawInternships = splitEntries(profile.internshipsText);
      const internshipItems = rawInternships.map(entry => {
        const norm = normalizeText(entry);

        // Judicial / litigation signals apply regardless of practice area
        if (JUDICIAL_TIER1_SIGNAL.test(norm)) return { name: entry, tier: "Tier 1", score: 90 };

        const isAdvocateChamber = CHAMBER_LITIGATION_SIGNAL.test(norm);

        // Step 1: direct, typo-tolerant match against the SELECTED PRACTICE AREA's own tier lists —
        // this is the primary and most accurate path, and catches boutique/specialist firms that
        // aren't in the generic MASTER_COMPANIES database at all (e.g. Economic Laws Practice, Wadia
        // Ghandy & Co, Arista Chambers, IC Universal Legal).
        for (let tierLabel of ["Tier 1", "Tier 2", "Tier 3", "Tier 4"]) {
          const list = firmTiersForPractice[tierLabel] || [];
          const hit = list.find(f => isFirmMatch(f, norm) || isFirmMatch(norm, f));
          if (hit) {
            const score = tierLabel === "Tier 1" ? 90 : tierLabel === "Tier 2" ? 75 : tierLabel === "Tier 3" ? 65 : 55;
            return { name: entry, tier: tierLabel, score };
          }
        }

        // Step 2: not tiered for this specific practice — check if it's at least a recognised entity
        // elsewhere (LAW_FIRM_ALIASES / MASTER_COMPANIES / any OTHER practice area's tier lists), so we
        // can still say "recognised firm, just not tiered for THIS practice" rather than "unknown".
        let resolvedName = null;
        for (let aliasObj of LAW_FIRM_ALIASES) {
          for (let alias of aliasObj.aliases) {
            if (isFirmMatch(alias, norm)) { resolvedName = aliasObj.canonical; break; }
          }
          if (resolvedName) break;
        }
        if (!resolvedName) {
          for (let company of MASTER_COMPANIES) {
            if (isFirmMatch(company.name, norm)) { resolvedName = company.name; break; }
          }
        }
        if (!resolvedName) {
          outer: for (let pa of PRACTICE_AREAS) {
            const tiers = PRACTICE_AREA_FIRM_TIERS[pa] || {};
            for (let tierLabel of ["Tier 1", "Tier 2", "Tier 3", "Tier 4"]) {
              const hit = (tiers[tierLabel] || []).find(f => isFirmMatch(f, norm) || isFirmMatch(norm, f));
              if (hit) { resolvedName = hit; break outer; }
            }
          }
        }

        if (resolvedName) {
          // Re-check the practice tier lists using the now-resolved canonical name (covers abbreviations
          // like "NDA", "AZB", "SAM", "CAM" that Step 1's literal match wouldn't catch on their own).
          for (let tierLabel of ["Tier 1", "Tier 2", "Tier 3", "Tier 4"]) {
            const list = firmTiersForPractice[tierLabel] || [];
            if (list.some(f => isFirmMatch(f, resolvedName) || isFirmMatch(resolvedName, f))) {
              const score = tierLabel === "Tier 1" ? 90 : tierLabel === "Tier 2" ? 75 : tierLabel === "Tier 3" ? 65 : 55;
              return { name: entry, tier: tierLabel, score };
            }
          }
          const genericMatch = MASTER_COMPANIES.find(c => c.name.toLowerCase() === resolvedName.toLowerCase());
          const fallbackScore = genericMatch ? (genericMatch.tier === "Tier 1" ? 70 : genericMatch.tier === "Tier 2" ? 60 : 55) : 55;
          return { name: entry, tier: "Tier 4 / Unlisted for " + targetPractice, score: fallbackScore };
        }

        if (isAdvocateChamber) return { name: entry, tier: "Tier 2", score: 75 };

        // Not a recognised entity at all
        if (/internship|intern|trainee|associates|advocates|firm|chambers/i.test(norm)) {
          return { name: entry, tier: "Tier 4 / Unlisted for " + targetPractice, score: 55 };
        }
        return { name: entry, tier: "Not Tiered", score: 50 };
      });

      // 3. Editorial Experience & Publications — journal tier matrix
      const rawPubs = splitEntries(profile.publicationsText);
      const publicationItems = rawPubs.map(entry => {
        const norm = normalizeText(entry);

        if (JOURNAL_TIERS["Tier 1"].some(k => norm.includes(k))) return { name: entry, tier: "Tier 1", score: 90 };
        if (JOURNAL_TIERS["Tier 2"].some(k => norm.includes(k))) return { name: entry, tier: "Tier 2", score: 75 };
        if (JOURNAL_TIERS["Tier 3"].some(k => norm.includes(k))) return { name: entry, tier: "Tier 3", score: 65 };

        return { name: entry, tier: "Not Tiered", score: 50 };
      });

      // 4. Extra-Curricular Activities — moots + leadership/society roles combined into one scored bucket
      const rawLeadership = (profile.leadershipEntries || []).map(e => e.trim()).filter(e => e.length > 0);
      const leadershipItems = rawLeadership.map(entry => {
        const norm = normalizeText(entry);
        if (/founder|president|creator|owner|captain/i.test(norm)) {
          return { name: entry, tier: "Tier 1", score: 90 };
        }
        if (/general secretary|treasurer|vice president|core committee/i.test(norm)) {
          return { name: entry, tier: "Tier 1", score: 80 };
        }
        if (/director|head|editor-in-chief/i.test(norm)) {
          return { name: entry, tier: "Tier 2", score: 75 };
        }
        if (/sub-head|organising committee|organizing committee|oc member|convener|volunteer|member/i.test(norm)) {
          return { name: entry, tier: "Tier 3", score: 65 };
        }
        return { name: entry, tier: "Not Tiered", score: 50 };
      });

      const rawMoots = splitEntries(profile.mootsText);
      const mootItems = rawMoots.map(entry => {
        const norm = normalizeText(entry);
        if (/jessup|vis|fdi|elmc|price|icc|international/i.test(norm)) {
          return { name: entry, tier: "Tier 1", score: 90 };
        }
        if (/nlsiu|nalsar|nujs|nlu|national/i.test(norm)) {
          return { name: entry, tier: "Tier 2", score: 75 };
        }
        return { name: entry, tier: "Tier 3", score: 65 };
      });

      const ecaItems = [...mootItems, ...leadershipItems];

      // 5. Certifications & Courses — low weight UNLESS it matches the selected practice area
      const rawCerts = splitEntries(profile.certificationsText);
      const practiceCertKeywords = CERT_KEYWORDS_BY_PRACTICE[targetPractice] || [];
      const certificationItems = rawCerts.map(entry => {
        const norm = normalizeText(entry);
        const matchesPractice = practiceCertKeywords.some(k => norm.includes(normalizeText(k)));
        if (matchesPractice) {
          return { name: entry, tier: `Tier 1 (Matched: ${targetPractice})`, score: 90 };
        }
        // Recognised but off-practice certifications still carry some (low) weight
        return { name: entry, tier: "Low-Weight / Off-Practice", score: 55 };
      });

      // Helper to calculate category score + boosters
      const calculateCategory = (items) => {
        if (!items || items.length === 0) return { count: 0, boost: 0, score: 0, baseSum: 0, items: [] };
        const baseSum = items.reduce((acc, item) => acc + item.score, 0);

        let t1 = items.filter(i => i.tier === "Tier 1" || i.tier.startsWith("Tier 1")).length;
        let t2 = items.filter(i => i.tier === "Tier 2").length;
        let t3 = items.filter(i => i.tier === "Tier 3").length;
        let nt = items.filter(i => i.tier === "Not Tiered").length;

        let booster = 0;
        if (t1 >= 4) booster = 10;
        else if (t2 >= 3) booster = 7;
        else if (t3 >= 3) booster = 5;
        else if (nt >= 3) booster = 5;

        const categoryScore = Math.min(100, (baseSum + booster) / items.length);
        return {
          count: items.length,
          baseSum,
          boost: booster,
          score: categoryScore,
          items
        };
      };

      const academicsCat = calculateCategory(academicItems);
      const internshipsCat = calculateCategory(internshipItems);
      const publicationsCat = calculateCategory(publicationItems);
      const ecaCat = calculateCategory(ecaItems);
      const certificationsCat = calculateCategory(certificationItems);

      const categories = {
        "Educational Qualifications": academicsCat,
        "Internships & Work Experience": internshipsCat,
        "Editorial Experience & Publications": publicationsCat,
        "Extra-Curricular Activities": ecaCat,
        "Certifications & Courses": certificationsCat
      };

      const allCategories = Object.values(categories);
      const overallSum = allCategories.reduce((acc, c) => acc + c.score, 0);
      const overallReadiness = Math.round(overallSum / allCategories.length);
      const maxTotal = allCategories.length * 100;

      // --- Rule-based Tier Target classification (exact thresholds, not just an averaged score) ---
      const tier1InternshipCount = internshipItems.filter(i => i.tier === "Tier 1").length;
      const tier1or2InternshipCount = internshipItems.filter(i => i.tier === "Tier 1" || i.tier === "Tier 2").length;
      const publicationCount = publicationItems.length;
      const leadershipCount = leadershipItems.length;
      const mootCount = mootItems.length;

      let classification = "";
      let tierRating = "";

      if (
        cgpa >= 7.5 && tier1InternshipCount >= 3 && publicationCount >= 2 &&
        leadershipCount >= 2 && mootCount >= 1
      ) {
        classification = "Elite Recruiter Ready";
        tierRating = "Tier 1 Target — Day-Zero Threshold Met";
      } else if (
        cgpa >= 7.0 && tier1InternshipCount >= 1 && publicationCount >= 1 && leadershipCount >= 1
      ) {
        classification = "Competitive Asset";
        tierRating = "Tier 2 Target — Day-One Threshold Met";
      } else if (
        cgpa >= 6.8 && tier1or2InternshipCount >= 1 && leadershipCount >= 1
      ) {
        classification = "Developing Profile";
        tierRating = "Tier 3 Target — Boutique/Day-Two Threshold Met";
      } else {
        classification = "Below Tier 3 Target";
        tierRating = "Requires Improvement Before Any Tier Target Is Met";
      }

      const tierTargetRequirements = {
        "Tier 1 Target": { cgpa: 7.5, tier1Internships: 3, publications: 2, leadership: 2, moots: 1 },
        "Tier 2 Target": { cgpa: 7.0, tier1Internships: 1, publications: 1, leadership: 1, moots: 0 },
        "Tier 3 Target": { cgpa: 6.8, tier1or2Internships: 1, leadership: 1 }
      };

      return {
        overallSum,
        overallReadiness,
        maxTotal,
        classification,
        tierRating,
        targetPractice,
        categories,
        tierProgress: { cgpa, tier1InternshipCount, tier1or2InternshipCount, publicationCount, leadershipCount, mootCount },
        tierTargetRequirements
      };
    };

    // --- ONBOARDING MODAL COMPONENT ---
    const Onboarding = ({ profile, setProfile, onComplete }) => {
      const [step, setStep] = useState(1);
      const [disclaimerAccepted, setDisclaimerAccepted] = useState(false);

      const handleNext = () => {
        if (step === 1) {
          if (!profile.fullName || !profile.studentId || !profile.cgpa || !profile.programme || !profile.studyYear) {
            alert("Please complete all required academic profile fields.");
            return;
          }
          const cgpaNum = parseFloat(profile.cgpa);
          if (isNaN(cgpaNum) || cgpaNum < 1.0 || cgpaNum > 8.0) {
            alert("Please enter a valid JGLS CGPA between 1.00 and 8.00.");
            return;
          }
          setStep(2);
        } else if (step === 2) {
          if (!profile.internshipsText || !profile.internshipsText.trim()) {
            alert("Please fill in the Internships & Work Experience field.");
            return;
          }
          setStep(3);
        } else if (step === 3) {
          if (!profile.targetPractice) {
            alert("Please select a target practice group — the CV Auditor and every other module tier your profile against it.");
            return;
          }
          if (!disclaimerAccepted) {
            alert("You must accept the institutional disclaimer to generate your dashboard.");
            return;
          }
          onComplete();
        }
      };

      return (
        <div className="min-h-screen w-full bg-bgOffwhite overflow-y-auto">
          {/* Slim full-width header, matching the main app's header so onboarding reads as part of the same platform, not a popup */}
          <header className="border-b border-rule px-6 py-4 flex items-center space-x-3 bg-bgOffwhite">
            <div className="bg-navy-800 text-white p-2 rounded-xl">
              <Icon name="shield" className="w-5 h-5" />
            </div>
            <div>
              <h1 className="text-lg font-bold tracking-tight text-ink">Placement OS</h1>
              <p className="text-[11px] text-brandGrey tracking-tight font-medium">Created by Kriti Shah</p>
            </div>
          </header>

          <div className="w-full flex justify-center px-4 py-8">
            <div className="max-w-3xl w-full bg-white rounded-2xl p-6 md:p-8 shadow-card border border-brandLightGrey">

              {/* 3-Step Progress Bar */}
              <div className="grid grid-cols-3 gap-2 mb-8">
                <div className={`h-1.5 rounded-full ${step >= 1 ? 'bg-navy-800' : 'bg-brandLightGrey'}`}></div>
                <div className={`h-1.5 rounded-full ${step >= 2 ? 'bg-navy-800' : 'bg-brandLightGrey'}`}></div>
                <div className={`h-1.5 rounded-full ${step >= 3 ? 'bg-navy-800' : 'bg-brandLightGrey'}`}></div>
              </div>

              <div className="text-xs text-brandGrey font-bold uppercase tracking-wider mb-4">
                Step {step} of 3: {step === 1 ? "Academic Profile Verification" : step === 2 ? "CV Placement Content" : "Targeting / Disclaimer"}
              </div>

            {/* Step 1: Academic Profile */}
            {step === 1 && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-ink mb-1">Full Name *</label>
                    <input 
                      type="text"
                      className="w-full bg-white border border-brandLightGrey rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500"
                      placeholder="e.g. Kriti Shah"
                      value={profile.fullName}
                      onChange={e => setProfile({...profile, fullName: e.target.value})}
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-ink mb-1">Student ID *</label>
                    <input 
                      type="text"
                      className="w-full bg-white border border-brandLightGrey rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500"
                      placeholder="e.g. 2301XXXX"
                      value={profile.studentId}
                      onChange={e => setProfile({...profile, studentId: e.target.value})}
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-ink mb-1">Academic Programme</label>
                    <select 
                      className="w-full bg-white border border-brandLightGrey rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500"
                      value={profile.programme}
                      onChange={e => setProfile({...profile, programme: e.target.value})}
                    >
                      <option value="" disabled>Select programme</option>
                      <option value="5 year B.A L.L.B (Hons.)">5 year B.A L.L.B (Hons.)</option>
                      <option value="5 year B.B.A L.L.B (Hons.)">5 year B.B.A L.L.B (Hons.)</option>
                      <option value="5 year B.Com L.L.B (Hons.)">5 year B.Com L.L.B (Hons.)</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-ink mb-1">Study Year</label>
                    <select 
                      className="w-full bg-white border border-brandLightGrey rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500"
                      value={profile.studyYear}
                      onChange={e => setProfile({...profile, studyYear: e.target.value})}
                    >
                      <option value="" disabled>Select year</option>
                      <option value="1st Year">1st Year</option>
                      <option value="2nd Year">2nd Year</option>
                      <option value="3rd Year">3rd Year</option>
                      <option value="4th Year">4th Year</option>
                      <option value="5th Year">5th Year</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-ink mb-1">Cumulative JGLS CGPA *</label>
                    <input 
                      type="number"
                      step="0.01"
                      min="1.00"
                      max="8.00"
                      className="w-full bg-white border border-brandLightGrey rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500"
                      placeholder="7.15"
                      value={profile.cgpa}
                      onChange={e => setProfile({...profile, cgpa: e.target.value})}
                    />
                    <span className="text-[10px] text-brandGrey mt-1 block">Official CGPA on JGLS 8.0 grading scale</span>
                  </div>
                </div>
              </div>
            )}

            {/* Step 2: CV Placement Content */}
            {step === 2 && (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-ink mb-1">
                    Internships & Work Experience *
                  </label>
                  <p className="text-[11px] text-brandGrey mb-1 font-mono">
                    List the duration and name of the place you worked. Firms are tiered against the practice area you pick in the next step — e.g. "1 month internship at Nishith Desai and Associates; 2 weeks at High Court Chamber"
                  </p>
                  <textarea 
                    rows="3"
                    className="w-full bg-white border border-brandLightGrey rounded-lg p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent-500 font-mono"
                    placeholder="1 month internship at Nishith Desai and Associates; Judicial clerkship under Delhi High Court"
                    value={profile.internshipsText}
                    onChange={e => setProfile({...profile, internshipsText: e.target.value})}
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase text-ink mb-1">
                    Moot Court Experience
                  </label>
                  <p className="text-[11px] text-brandGrey mb-1 font-mono">
                    Separate multiple moots with semicolons or newlines. Counted under Extra-Curricular Activities.
                  </p>
                  <textarea 
                    rows="2"
                    className="w-full bg-white border border-brandLightGrey rounded-lg p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent-500 font-mono"
                    placeholder="Jessup International Moot Court (Quarter-finalist); National Moot Competition"
                    value={profile.mootsText}
                    onChange={e => setProfile({...profile, mootsText: e.target.value})}
                  />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-ink mb-1">Editorial Experience & Publications</label>
                    <textarea 
                      rows="2"
                      className="w-full bg-white border border-brandLightGrey rounded-lg p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent-500 font-mono"
                      placeholder="Scopus Indexed Journal Article; Bar & Bench opinion paper"
                      value={profile.publicationsText}
                      onChange={e => setProfile({...profile, publicationsText: e.target.value})}
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase text-ink mb-1">Student Body Leadership & Competitions</label>
                  <p className="text-[11px] text-brandGrey mb-1 font-mono">
                    Add each position separately — counted, together with Moot Court Experience above, under Extra-Curricular Activities.
                  </p>
                  <div className="space-y-2">
                    {profile.leadershipEntries.length === 0 && (
                      <div className="text-[11px] text-brandGrey italic p-2 border border-dashed border-brandLightGrey rounded-lg">
                        No positions added yet — click "+ Add Position" below.
                      </div>
                    )}
                    {profile.leadershipEntries.map((entry, idx) => (
                      <div key={idx} className="flex items-center gap-2">
                        <input
                          type="text"

    const SENTIMENT_LEX = {
      hedges: ["maybe", "perhaps", "i think", "i guess", "kind of", "sort of", "not sure", "probably", "might", "i suppose", "i don't know", "i dont know", "hopefully", "somewhat", "i feel like", "possibly", "um", "uh"],
      assertive: ["clearly", "definitely", "specifically", "therefore", "i led", "i drafted", "i recommend", "i would advise", "the key", "in my view", "i concluded", "i ensured", "i delivered", "must", "i would", "i negotiated", "i prepared", "i reviewed", "the risk is", "the main risk"],
      defensive: ["but i", "not my fault", "not my job", "i was just", "only assisted", "they didn't", "they didnt", "unfortunately", "blame", "that's unfair", "i already said", "it wasn't me"],
      positive: ["excited", "enjoy", "enjoyed", "passionate", "love", "keen", "motivated", "eager", "interested", "fascinated", "curious"],
      negative: ["hate", "boring", "waste", "useless", "annoying", "dislike", "terrible", "pointless"]
    };

    const analyzeSentiment = (text, elapsedSec) => {
      const norm = normalizeText(text || "");
      const words = norm.split(" ").filter(Boolean).length;
      const count = (list) => list.reduce((a, k) => a + (norm.includes(normalizeText(k)) ? 1 : 0), 0);
      const hedge = count(SENTIMENT_LEX.hedges), assertive = count(SENTIMENT_LEX.assertive), defensive = count(SENTIMENT_LEX.defensive);
      const positive = count(SENTIMENT_LEX.positive), negative = count(SENTIMENT_LEX.negative);

      let label = "Neutral", note = "Even, professional register.";
      if (words < 8) { label = "Flat / Too brief"; note = "Too little to read confidence from — the room hears disengagement."; }
      else if (negative >= 1 && positive === 0) { label = "Negative"; note = "Negative framing slipped in; partners notice attitude quickly."; }
      else if (defensive >= 1 && defensive >= assertive) { label = "Defensive"; note = "Reads as defensive — describe what you did, not what you weren't responsible for."; }
      else if (hedge >= 2 && hedge > assertive) { label = "Hesitant"; note = "Heavy hedging ('maybe', 'I think') weakens an otherwise fine answer — commit to a position."; }
      else if (assertive >= 2 && hedge <= 1) { label = "Confident"; note = "Clear, committed delivery."; }
      else if (positive >= 1 && negative === 0) { label = "Enthusiastic"; note = "Genuine energy comes through."; }

      let confidence = 55 + assertive * 10 - hedge * 10 - defensive * 8 - negative * 8 + positive * 4;
      if (words < 8) confidence = Math.min(confidence, 30);
      confidence = Math.max(5, Math.min(98, confidence));
      let pace = null;
      if (typeof elapsedSec === "number") pace = elapsedSec < 45 ? "Prompt" : elapsedSec <= 120 ? "Measured" : "Slow";
      return { label, note, confidence, hedge, assertive, defensive, positive, negative, pace };
    };

      return { xp: 0, streak: 0, lastDay: null, completed: {}, badges: [] };

    const dzLevel = (xp) => {
      let idx = 0;
      DZ_LEVELS.forEach((l, i) => { if (xp >= l.min) idx = i; });
      const next = DZ_LEVELS[idx + 1];
      return { idx, title: DZ_LEVELS[idx].title, next, pct: next ? Math.round(((xp - DZ_LEVELS[idx].min) / (next.min - DZ_LEVELS[idx].min)) * 100) : 100 };
    };
    const dzCommercialScore = (state) => {
      const vals = Object.values(state.completed || {});
      const max = vals.reduce((a, v) => a + v.max, 0);
      const got = vals.reduce((a, v) => a + v.score, 0);
      return { pct: max ? Math.round((got / max) * 100) : null, cases: vals.length };
    };

    const getInternshipEntries = (profile) => {
      const raws = (profile.internshipsText || "").split(/[\n;]/).map(s => s.trim()).filter(Boolean);
      return raws.map(raw => {
        const m = raw.match(/^(.*?)(?:\s[—–-]\s|:\s)(.+)$/);
        const heading = (m ? m[1] : raw).trim();
        const inlineWork = m ? m[2].trim() : "";
        const key = normalizeText(heading);
        const dur = raw.match(/(\d+(?:\.\d+)?\s*(?:weeks?|months?|days?))/i);
        const saved = (profile.internshipWork || {})[key];
        return { key, raw, heading, duration: dur ? dur[1] : "", work: typeof saved === "string" ? saved : inlineWork };
      });
    };

    const ATS_VERB_KEYS = Object.keys(ATS_VERBS).join("|");
    const ATS_LEGAL_TERMS = ["agreement", "contract", "petition", "memorandum", "memo", "due diligence", "clause", "statute", "act", "section", "compliance", "filing", "hearing", "pleading", "research", "notice", "opinion", "sha", "spa", "term sheet", "arbitration", "trademark", "patent", "copyright", "regulatory", "diligence", "checklist", "tracker", "judgment", "case law", "affidavit", "plaint", "written statement"];

    const cleanAtsClause = (clause) => {
      let s = clause.replace(/\s+/g, " ").replace(/^[\s\-•*·,]+/, "").trim();
      if (!s) return "";
      s = s.replace(/^(?:and|then|also|additionally|plus)\s+/i, "");
      s = s.replace(/^(?:i|we)\s+(?:was|were|have|had|also|then)?\s*/i, "");
      s = s.replace(/^(?:was|were)\s+(?:responsible for|involved in|tasked with)\s+/i, "");
      s = s.replace(/^(?:responsible for|tasked with|got to|had the opportunity to|had an opportunity to|got the chance to)\s+/i, "");
      s = s.replace(/\b(?:my|our)\s+/gi, "");
      let leadAssist = null;
      const am = s.match(/^(?:assisted|helped|assisting|helping|involved in|worked on|worked with|working on)\s+(?:with\s+|in\s+|on\s+)?(.*)$/i);
      if (am) { leadAssist = /^(?:worked|working)/i.test(s) ? "work" : "assist"; s = am[1]; }
      s = s.replace(/[.\s]+$/, "");
      if (!s) return "";
      const first = s.split(" ")[0].toLowerCase();
      let out;
      if (ATS_VERBS[first] && !leadAssist) {
        out = ATS_VERBS[first] + " " + s.split(" ").slice(1).join(" ");
      } else {
        const low = s.toLowerCase();
        let verb;
        if (ATS_VERBS[first] && leadAssist) { verb = ATS_VERBS[first]; s = s.split(" ").slice(1).join(" "); }
        else if (/research|case law|precedent|judgment|authorit/.test(low)) verb = "Researched";
        else if (/draft|agreement|contract|clause|notice|petition|pleading|plaint|affidavit|deed|sha\b|spa\b/.test(low)) verb = "Drafted";
        else if (/due diligence|diligence|review|verif|check|audit/.test(low)) verb = "Reviewed";
        else if (/hearing|court|appear|argument/.test(low)) verb = "Attended";
        else if (/compliance|checklist|tracker|memo|note|report|summary|opinion/.test(low)) verb = "Prepared";
        else verb = leadAssist === "assist" ? "Supported" : "Contributed to";
        out = verb + " " + s;
        if (leadAssist === "assist" && verb !== "Supported") out = "Assisted in " + verb.toLowerCase().replace(/ed$/, "ing").replace(/^drafting$/, "drafting") + " " + s;
        if (leadAssist === "assist" && verb === "Drafted") out = "Assisted in drafting " + s;
        if (leadAssist === "assist" && verb === "Researched") out = "Assisted in researching " + s;
        if (leadAssist === "assist" && verb === "Reviewed") out = "Assisted in reviewing " + s;
        if (leadAssist === "assist" && verb === "Prepared") out = "Assisted in preparing " + s;
        if (leadAssist === "assist" && verb === "Attended") out = "Attended " + s;
      }
      out = out.replace(/\s+/g, " ").trim();
      const w = out.split(" ");
      if (w.length > 26) {
        const cut = out.split(" ").slice(0, 26).join(" ");
        const lastComma = Math.max(cut.lastIndexOf(","), cut.lastIndexOf(" and "));
        out = (lastComma > 40 ? cut.slice(0, lastComma) : cut).trim();
      }
      return out.charAt(0).toUpperCase() + out.slice(1);
    };

    const generateAtsBullets = (workText, targetPractice) => {
      if (!workText || !workText.trim()) return [];
      const splitter = new RegExp("[.;\\n]+|,\\s*(?:and\\s+)?(?=(?:" + ATS_VERB_KEYS + ")\\b)|\\s+and\\s+(?=(?:" + ATS_VERB_KEYS + ")\\b)", "i");
      const clauses = workText.split(splitter).map(c => (c || "").trim()).filter(c => c && c.split(/\s+/).length >= 2);
      const kws = PRACTICE_KEYWORDS[targetPractice] || [];
      const cleaned = clauses.map((c, idx) => ({ text: cleanAtsClause(c), idx })).filter(o => o.text && o.text.split(" ").length >= 3);
      const scored = cleaned.map(o => {
        const low = o.text.toLowerCase();
        let sc = 0;
        sc += ATS_LEGAL_TERMS.filter(t => low.includes(t)).length * 2;
        sc += kws.filter(k => low.includes(k)).length * 2;
        sc += /\d/.test(o.text) ? 2 : 0;
        sc += (o.text.match(/\b[A-Z]{2,}\b/g) || []).length;
        sc += Math.min(3, Math.floor(o.text.split(" ").length / 6));
        return { ...o, sc };
      });
      const top = scored.sort((a, b) => b.sc - a.sc).slice(0, 3).sort((a, b) => a.idx - b.idx);
      const seen = new Set();
      return top.map(o => o.text).filter(t => { const k = t.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    };

    // ============================================================================================
    // FIT SCORE ENGINE — "Candidate × Firm × Practice Area" alignment model.
    // Replaces "firm tier = score" with a weighted multi-factor Application Fit percentage. This is
    // NOT a probability of getting hired — it measures how closely the candidate's demonstrated
    // profile aligns with what a given practice area (and, optionally, a specific firm) looks for.
    // The same CV can score very differently against a different practice area or firm.
    // ============================================================================================
    const FIT_WEIGHTS = {
      practiceAlignment: 0.30,
      internshipRelevance: 0.25,
      firmPrestige: 0.15,
      academicAlignment: 0.10,
      skillsWork: 0.10,
      location: 0.05,
      applicationProfile: 0.05
    };

    const computeFitScore = (profile, overridePractice, overrideFirm) => {
      const targetPractice = overridePractice || profile.targetPractice || "General Corporate";
      const firmTiersForPractice = PRACTICE_AREA_FIRM_TIERS[targetPractice] || PRACTICE_AREA_FIRM_TIERS["General Corporate"];
      const keywords = PRACTICE_KEYWORDS[targetPractice] || [];

      const splitEntries = (text) => (text || "").split(/[\n;]/).map(e => e.trim()).filter(e => e.length > 0);
      const internships = splitEntries(profile.internshipsText);
      const cgpa = parseFloat(profile.cgpa) || 0;

      // Resolve each internship's practice-tier (reusing the same fuzzy-match approach as the CV Auditor)
      const resolveInternshipTier = (entry) => {
        const norm = normalizeText(entry);
        if (JUDICIAL_TIER1_SIGNAL.test(norm)) return "Tier 1";
        for (let tierLabel of ["Tier 1", "Tier 2", "Tier 3", "Tier 4"]) {
          const hit = (firmTiersForPractice[tierLabel] || []).find(f => isFirmMatch(f, norm) || isFirmMatch(norm, f));
          if (hit) return tierLabel;
        }
        if (CHAMBER_LITIGATION_SIGNAL.test(norm)) return "Tier 2";
        return "Not Tiered";
      };

      const internshipTiers = internships.map(resolveInternshipTier);

      // --- 1. Practice-Area Alignment (30%) — what fraction of the candidate's demonstrated
      // internship experience is recognised as relevant to THIS practice area, plus a bonus for
      // internship text that directly engages the practice area's own task vocabulary.
      let practiceAlignment;
      if (internships.length === 0) {
        practiceAlignment = 30; // no internships yet — low but not zero, since a candidate can still be early-career
      } else {
        const tieredCount = internshipTiers.filter(t => t !== "Not Tiered").length;
        const tierRatio = tieredCount / internships.length;
        const keywordHitEntries = internships.filter(e => {
          const norm = normalizeText(e);
          return keywords.some(k => norm.includes(k));
        }).length;
        const keywordRatio = keywordHitEntries / internships.length;
        practiceAlignment = Math.round(Math.min(100, tierRatio * 60 + keywordRatio * 40));
      }

      // --- 2. Relevant Internship Experience (25%) — reads what the candidate actually WROTE about
      // each internship (not just the firm name) and scores keyword density against this practice's
      // task vocabulary. This is what makes disputes/litigation experience score on WORK, not just firm.
      let internshipRelevance;
      if (internships.length === 0) {
        internshipRelevance = 20;
      } else {
        let totalHits = 0;
        internships.forEach(e => {
          const norm = normalizeText(e);
          totalHits += keywords.filter(k => norm.includes(k)).length;
        });
        const avgHitsPerEntry = totalHits / internships.length;
        internshipRelevance = Math.round(Math.min(100, 35 + avgHitsPerEntry * 22));
      }

      // --- 3. Firm-Level Experience / Prestige (15%) — average practice-specific tier of internships.
      let firmPrestige;
      if (overrideFirm) {
        // Scoring against one specific named firm: does the candidate have experience there, and what tier is it?
        const normFirm = normalizeText(overrideFirm);
        let firmTierLabel = "Tier 4";
        for (let tierLabel of ["Tier 1", "Tier 2", "Tier 3", "Tier 4"]) {
          if ((firmTiersForPractice[tierLabel] || []).some(f => isFirmMatch(f, normFirm) || isFirmMatch(normFirm, f))) { firmTierLabel = tierLabel; break; }
        }
        const hasExperienceThere = internships.some(e => isFirmMatch(overrideFirm, normalizeText(e)) || isFirmMatch(normalizeText(e), overrideFirm));
        const tierBase = firmTierLabel === "Tier 1" ? 60 : firmTierLabel === "Tier 2" ? 50 : firmTierLabel === "Tier 3" ? 40 : 30;
        firmPrestige = Math.min(100, tierBase + (hasExperienceThere ? 40 : 0));
      } else if (internshipTiers.length === 0) {
        firmPrestige = 30;
      } else {
        const tierScore = (t) => t === "Tier 1" ? 100 : t === "Tier 2" ? 75 : t === "Tier 3" ? 55 : t === "Tier 4" ? 40 : 25;
        firmPrestige = Math.round(internshipTiers.reduce((a, t) => a + tierScore(t), 0) / internshipTiers.length);
      }

      // --- 4. Academic Alignment (10%) — CGPA baseline plus elective relevance, weighted by grade.
      const cgpaScore = Math.min(100, Math.max(0, (cgpa / 8) * 100));
      const electiveEntries = splitEntries(profile.electivesText);
      const gradeToScore = (g) => {
        const gm = (g || "").toUpperCase().replace(/\s/g, "");
        if (gm.includes("A+")) return 100;
        if (gm.includes("A")) return 90;
        if (gm.includes("B+")) return 80;
        if (gm.includes("B")) return 70;
        if (gm.includes("C")) return 55;
        return 65; // no grade specified — assume a middling pass
      };
      let electiveBonus = 0;
      if (electiveEntries.length > 0) {
        const relevantElectives = electiveEntries.filter(e => {
          const norm = normalizeText(e);
          return keywords.some(k => norm.includes(k)) || norm.includes(normalizeText(targetPractice).split(" ")[0]);
        });
        if (relevantElectives.length > 0) {
          const avgGrade = relevantElectives.reduce((a, e) => {
            const gradeMatch = e.match(/-\s*([A-D][+-]?)\s*$/);
            return a + gradeToScore(gradeMatch ? gradeMatch[1] : "");
          }, 0) / relevantElectives.length;
          electiveBonus = Math.round(avgGrade * 0.25); // electives can add up to +25 on top of CGPA baseline
        }
      }
      const academicAlignment = Math.round(Math.min(100, cgpaScore * 0.75 + electiveBonus));

      // --- 5. Skills / Demonstrated Work (10%) — publications + certifications relevant to the practice.
      const publications = splitEntries(profile.publicationsText);
      const certs = splitEntries(profile.certificationsText);
      const certKeywords = CERT_KEYWORDS_BY_PRACTICE[targetPractice] || [];
      const relevantPubs = publications.filter(p => keywords.some(k => normalizeText(p).includes(k)));
      const relevantCerts = certs.filter(c => certKeywords.some(k => normalizeText(c).includes(normalizeText(k))));
      let skillsWork = 40; // baseline
      skillsWork += Math.min(30, publications.length * 8 + relevantPubs.length * 12);
      skillsWork += Math.min(30, relevantCerts.length * 15);
      skillsWork = Math.round(Math.min(100, skillsWork));

      // --- 6. Location / Role Preference (5%) — light-touch, since we don't have per-firm office data.
      const location = profile.locationText && profile.locationText.trim() ? 90 : 70;

      // --- 7. Application Profile Completeness (5%) — rewards a fully filled-out, thorough profile.
      const optionalFields = [profile.mootsText, profile.publicationsText, (profile.leadershipEntries || []).join(""), profile.certificationsText, profile.electivesText, profile.locationText, profile.preferredFirmsText];
      const filledCount = optionalFields.filter(f => f && f.trim && f.trim().length > 0).length;
      const applicationProfile = Math.round((filledCount / optionalFields.length) * 100);

      const factors = {
        practiceAlignment, internshipRelevance, firmPrestige, academicAlignment, skillsWork, location, applicationProfile
      };

      const overallFit = Math.round(
        factors.practiceAlignment * FIT_WEIGHTS.practiceAlignment +
        factors.internshipRelevance * FIT_WEIGHTS.internshipRelevance +
        factors.firmPrestige * FIT_WEIGHTS.firmPrestige +
        factors.academicAlignment * FIT_WEIGHTS.academicAlignment +
        factors.skillsWork * FIT_WEIGHTS.skillsWork +
        factors.location * FIT_WEIGHTS.location +
        factors.applicationProfile * FIT_WEIGHTS.applicationProfile
      );

      let band = "Limited Alignment";
      if (overallFit >= 85) band = "Strong Alignment";
      else if (overallFit >= 70) band = "Solid Alignment";
      else if (overallFit >= 55) band = "Developing Alignment";
      else if (overallFit >= 40) band = "Emerging Alignment";

      // Identify the single biggest gap (lowest-scoring weighted factor) to surface as actionable advice.
      const factorLabels = {
        practiceAlignment: "Practice-area alignment", internshipRelevance: "Relevant internship experience",
        firmPrestige: "Firm-level experience/prestige", academicAlignment: "Academic alignment",
        skillsWork: "Skills / demonstrated work", location: "Location / role preferences",
        applicationProfile: "Application profile completeness"
      };
      const weakestFactor = Object.entries(factors).sort((a, b) => a[1] - b[1])[0];

      const gapAdvice = {
        practiceAlignment: `Your internships aren't yet clearly recognised as ${targetPractice} experience. Target at least one internship at a firm/team tiered for ${targetPractice}.`,
        internshipRelevance: `Your internship descriptions don't show much ${targetPractice}-specific task work. Rewrite them to name the actual matters, drafts, or research you did (e.g. specific agreements, filings, or hearings).`,
        firmPrestige: `Your internship firms aren't strongly tiered for ${targetPractice}. Consider a Tier 1/2 firm internship specifically in this practice area.`,
        academicAlignment: `Neither your CGPA nor your electives strongly signal ${targetPractice}. Consider taking (and naming) an elective closely tied to this practice area.`,
        skillsWork: `You have little demonstrated ${targetPractice}-relevant publication or certification work. A short practice-matched certification or a written piece would help here.`,
        location: `You haven't specified a location preference, which some recruiters weigh when shortlisting for specific offices.`,
        applicationProfile: `Several optional profile fields (moots, publications, leadership, certifications, electives, location, preferred firms) are still empty — filling these in gives a fuller picture.`
      };

      return {
        targetPractice,
        overrideFirm: overrideFirm || null,
        overallFit,
        band,
        factors,
        factorLabels,
        weights: FIT_WEIGHTS,
        weakestFactor: { key: weakestFactor[0], label: factorLabels[weakestFactor[0]], score: weakestFactor[1] },
        gapAdvice: gapAdvice[weakestFactor[0]]
      };
    };

    // --- MODULE 1: PLACEMENT DASHBOARD ---
    const PlacementDashboard = ({ parsedData, profile }) => {
      const { overallSum, overallReadiness, maxTotal, classification, tierRating, categories, tierProgress, tierTargetRequirements } = parsedData;

      const [qualReport, setQualReport] = useState(null);
      useEffect(() => {
        try {
          const raw = localStorage.getItem("placement_os_qualification_report");
          if (raw) setQualReport(JSON.parse(raw));
        } catch (e) { /* no saved report yet, or it's unreadable — that's fine */ }
      }, []);

      const [previewPractice, setPreviewPractice] = useState(profile.targetPractice || "General Corporate");
      const [previewFirm, setPreviewFirm] = useState("");
      const fit = useMemo(() => computeFitScore(profile, previewPractice, previewFirm.trim() || null), [profile, previewPractice, previewFirm]);

      const tierBadgeClasses = (tier) => {
        if (tier.startsWith("Tier 1")) return "bg-navy-800 text-white";
        if (tier === "Tier 2") return "bg-navy-500 text-white";
        if (tier === "Tier 3") return "bg-navy-200 text-navy-800";
        if (tier.startsWith("Tier 4")) return "bg-amber-100 text-amber-800";
        if (tier.startsWith("Low-Weight")) return "bg-brandLightGrey text-brandGrey";
        return "bg-brandLightGrey text-brandGrey";
      };

      const checkItem = (met, label) => (
        <div className={`flex items-center gap-1.5 text-[11px] ${met ? "text-navy-800 font-semibold" : "text-brandGrey"}`}>
          <span className={`w-3.5 h-3.5 rounded-full flex items-center justify-center shrink-0 ${met ? "bg-navy-800" : "bg-brandLightGrey"}`}>
            {met && <Icon name="checkCircle" className="w-3 h-3 text-white" />}
          </span>
          {label}
        </div>
      );

      return (
        <div className="space-y-6 fade-up">

          {/* Application Fit Hero Card */}
          <div className="card p-8 relative overflow-hidden">
            <div className="w-72 h-72 rounded-full bg-gradient-to-br from-navy-300 to-accent-500 absolute -bottom-28 -right-28 opacity-[0.08] pointer-events-none"></div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center relative">
              <div className="md:col-span-2 space-y-3">
                <div className="inline-flex items-center gap-2 bg-navy-800 text-white text-[11px] font-semibold px-3 py-1.5 rounded-full tracking-wide">
                  <Icon name="trendingUp" className="w-3.5 h-3.5" />
                  Candidate × Firm × Practice Area Fit Model
                </div>
                <h2 className="text-2xl md:text-3xl font-bold text-ink tracking-tight">
                  {fit.band}
                </h2>
                <p className="text-xs text-brandGrey max-w-xl leading-relaxed">
                  <strong>Application Fit</strong> measures how closely your current profile aligns with what {fit.overrideFirm ? fit.overrideFirm : "a"} {fit.targetPractice} {fit.overrideFirm ? "" : "team"} looks for — it is <strong>not</strong> a probability of being selected.
                </p>
              </div>

              {/* Fit Score Circular Metric Indicator */}
              <div className="flex flex-col items-center justify-center p-6 bg-navy-50 rounded-2xl text-center">
                <div className="text-4xl font-extrabold text-navy-800 tracking-tighter">
                  {fit.overallFit}<span className="text-lg font-normal text-brandGrey">%</span>
                </div>
                <div className="text-[10px] font-semibold uppercase tracking-widest text-brandGrey mt-1">
                  Application Fit
                </div>
              </div>
            </div>

            {/* Dynamic preview controls */}
            <div className="mt-6 pt-6 border-t border-rule grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-[10px] font-semibold uppercase text-brandGrey mb-1">Preview fit against a different practice area</label>
                <select
                  className="w-full bg-white border border-brandLightGrey rounded-lg px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-accent-500"
                  value={previewPractice}
                  onChange={e => setPreviewPractice(e.target.value)}
                >
                  {PRACTICE_AREAS.map(pa => <option key={pa} value={pa}>{pa}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[10px] font-semibold uppercase text-brandGrey mb-1">Preview fit against a specific firm (optional)</label>
                <input
                  type="text"
                  className="w-full bg-white border border-brandLightGrey rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-accent-500"
                  placeholder="e.g. AZB & Partners"
                  value={previewFirm}
                  onChange={e => setPreviewFirm(e.target.value)}
                />
              </div>
            </div>
            {previewPractice !== profile.targetPractice && (
              <p className="text-[11px] text-navy-700 font-semibold mt-2">
                Same CV, different target — this is what your profile looks like for {previewPractice} instead of your selected {profile.targetPractice}.
              </p>
            )}
          </div>

          {/* Fit Score Factor Breakdown */}
          <div className="card p-6 space-y-4">
            <h3 className="text-sm font-semibold text-ink border-b border-rule pb-3">Fit Score Breakdown</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead>
                  <tr className="border-b border-rule text-brandGrey">
                    <th className="p-2 font-semibold">Factor</th>
                    <th className="p-2 font-semibold text-center">Weight</th>
                    <th className="p-2 font-semibold text-right">Your Score</th>
                  </tr>
                </thead>
                <tbody className="divide-y border-rule">
                  {Object.entries(fit.factors).map(([key, value]) => (
                    <tr key={key} className={key === fit.weakestFactor.key ? "bg-red-50/40" : ""}>
                      <td className="p-2.5 font-medium text-ink">{fit.factorLabels[key]}</td>
                      <td className="p-2.5 text-center text-brandGrey">{Math.round(fit.weights[key] * 100)}%</td>
                      <td className="p-2.5 text-right font-semibold text-navy-800">{value}%</td>
                    </tr>
                  ))}
                  <tr className="border-t-2 border-navy-800">
                    <td className="p-2.5 font-bold text-ink">Overall Fit</td>
                    <td className="p-2.5 text-center text-brandGrey">100%</td>
                    <td className="p-2.5 text-right font-bold text-navy-800">{fit.overallFit}%</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-xs space-y-1">
              <span className="font-semibold text-ink">Your biggest gap: {fit.weakestFactor.label} ({fit.weakestFactor.score}%)</span>
              <p className="text-brandGrey">{fit.gapAdvice}</p>
            </div>
          </div>

          {/* Tier Target Progress Checklist */}
          <div className="card p-6 space-y-4">
            <h3 className="text-sm font-semibold text-ink border-b border-rule pb-3">Tier Target Progress</h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="space-y-1.5">
                <div className="text-[11px] font-semibold text-navy-800 mb-1">Tier 1 Target (CGPA ≥ 7.50)</div>
                {checkItem(tierProgress.cgpa >= 7.5, `CGPA ≥ 7.50 (yours: ${tierProgress.cgpa.toFixed(2)})`)}
                {checkItem(tierProgress.tier1InternshipCount >= 3, `3+ Tier 1 internships (yours: ${tierProgress.tier1InternshipCount})`)}
                {checkItem(tierProgress.publicationCount >= 2, `2+ publications (yours: ${tierProgress.publicationCount})`)}
                {checkItem(tierProgress.leadershipCount >= 2, `2+ leadership roles (yours: ${tierProgress.leadershipCount})`)}
                {checkItem(tierProgress.mootCount >= 1, `1+ moot court (yours: ${tierProgress.mootCount})`)}
              </div>
              <div className="space-y-1.5">
                <div className="text-[11px] font-semibold text-navy-800 mb-1">Tier 2 Target (CGPA ≥ 7.00)</div>
                {checkItem(tierProgress.cgpa >= 7.0, `CGPA ≥ 7.00 (yours: ${tierProgress.cgpa.toFixed(2)})`)}
                {checkItem(tierProgress.tier1InternshipCount >= 1, `1+ Tier 1 internship (yours: ${tierProgress.tier1InternshipCount})`)}
                {checkItem(tierProgress.publicationCount >= 1, `1+ publication (yours: ${tierProgress.publicationCount})`)}
                {checkItem(tierProgress.leadershipCount >= 1, `1+ leadership role (yours: ${tierProgress.leadershipCount})`)}
              </div>
              <div className="space-y-1.5">
                <div className="text-[11px] font-semibold text-navy-800 mb-1">Tier 3 Target (CGPA ≥ 6.80)</div>
                {checkItem(tierProgress.cgpa >= 6.8, `CGPA ≥ 6.80 (yours: ${tierProgress.cgpa.toFixed(2)})`)}
                {checkItem(tierProgress.tier1or2InternshipCount >= 1, `1+ Tier 1/2 internship (yours: ${tierProgress.tier1or2InternshipCount})`)}
                {checkItem(tierProgress.leadershipCount >= 1, `1+ leadership role (yours: ${tierProgress.leadershipCount})`)}
              </div>
            </div>
          </div>

          {/* Qualification Test Report */}
          {qualReport && (
            <div className="card p-6 space-y-4">
