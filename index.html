    // --- MODULE 3: MOCK INTERVIEW SIMULATOR (personas, tone analysis, follow-ups, commercial awareness) ---
    const MockInterview = ({ profile }) => {
      const [personaId, setPersonaId] = useState("associate");
      const persona = INTERVIEW_PERSONAS.find(p => p.id === personaId) || INTERVIEW_PERSONAS[1];

      const [interviewStarted, setInterviewStarted] = useState(false);
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [messages, setMessages] = useState([]);
      const [userInput, setUserInput] = useState("");
      const [isThinking, setIsThinking] = useState(false);
      const [questions, setQuestions] = useState([]);
      const [evaluations, setEvaluations] = useState([]);
      const [interviewCompleted, setInterviewCompleted] = useState(false);
      const [showExitModal, setShowExitModal] = useState(false);
      const [showScorecard, setShowScorecard] = useState(false);
      const [awaitingFollowUp, setAwaitingFollowUp] = useState(false);
      const questionStartRef = useRef(Date.now());

      const targetPractice = profile.targetPractice || "General Corporate";
      const industries = detectIndustries(profile);

      const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const clamp = (n) => Math.max(0, Math.min(100, Math.round(n)));
      const stamp = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // 10 type-tagged questions: personal/CV, commercial-awareness (industry + CV related, never firm related),
      // and technical (strictly this practice area + a contract basic). Different every run.
      const generateQuestions = (p) => {
        const qs = [];
        const used = new Set();
        const push = (text, type) => { if (text && !used.has(text)) { qs.push({ text, type }); used.add(text); } };

        const intros = [
          `To start, tell me a little about yourself, and how would you describe your experience in ${targetPractice} so far?`,
          `Walk me through your background in a couple of minutes, and tell me what draws you to ${targetPractice}.`,
          `Introduce yourself, and tell me which part of your experience so far has best prepared you for ${targetPractice}.`
        ];
        push(shuffle(intros)[0], "personal");

        const entries = getInternshipEntries(profile);
        shuffle(entries).slice(0, 2).forEach(e => {
          const first = generateAtsBullets(e.work, targetPractice)[0];
          if (first) push(`You describe your work at "${e.heading}" as: "${first}". Walk me through one matter in detail — what was your specific contribution, and what did you learn about ${targetPractice}?`, "personal");
          else push(`You listed "${e.heading}" on your CV. What did you actually do there, and what did it teach you about ${targetPractice}?`, "personal");
        });
        const lead = (profile.leadershipEntries || []).map(s => s.trim()).filter(Boolean);
        if (lead.length) push(`You mentioned "${shuffle(lead)[0]}" — how did that role prepare you for the pace of a demanding practice group?`, "personal");
        const pubs = (profile.publicationsText || "").split(/[\n;]/).map(s => s.trim()).filter(Boolean);
        if (pubs.length) push(`You mentioned "${shuffle(pubs)[0]}" on your CV — what was the core argument, and why does it matter to ${targetPractice}?`, "personal");
        while (qs.length > 4) qs.pop();

        // Commercial awareness: CV-detected industries first, then the practice area's own
        let need = p.commercialShare;
        let guard = 0;
        while (need > 0 && guard < 40) {
          guard++;
          const ind = industries[(guard - 1) % Math.max(1, industries.length)];
          const pool = shuffle(COMMERCIAL_QUESTIONS[ind] || []).filter(q => !used.has(q));
          if (pool.length) { push(pool[0], "commercial"); need--; }
        }

        // Technical: one contract basic + this practice area's own pool
        const topics = PRACTICE_AREA_TOPIC_MAP[targetPractice] || PRACTICE_AREA_TOPIC_MAP["General Corporate"];
        const technicalPool = [];
        topics.forEach(t => (TECHNICAL_QUESTIONS_BY_TOPIC[t] || []).forEach(q => technicalPool.push(q)));
        const basic = shuffle(TECHNICAL_QUESTIONS_BY_TOPIC["Contract Law"] || [])[0];
        const rest = shuffle(technicalPool);
        const target = 10;
        if (qs.length < target && basic) push(basic, "technical");
        rest.forEach(q => { if (qs.length < target) push(q, "technical"); });

        const intro = qs[0];
        const others = shuffle(qs.slice(1));
        return [intro, ...others].slice(0, 10);
      };

      const GENERIC_FILLERS = ["good", "nice", "great", "interesting", "really", "very", "lots", "things", "stuff", "learned"];
      const distinctive = (answerText) => answerText.split(/\W+/).filter(w => w.length > 6 && !GENERIC_FILLERS.includes(w.toLowerCase()))[0] || null;
      const countTerms = (norm, list) => list.filter(t => norm.includes(t)).length;

      const BIZ_TERMS = ["revenue", "margin", "cash flow", "cashflow", "profit", "valuation", "customer", "supplier", "distributor", "lender", "investor", "counterparty", "market", "competition", "pricing", "cost", "working capital", "growth", "business model", "exposure", "dependence", "concentration", "income"];
      const RISK_TERMS = ["risk", "default", "breach", "termination", "delay", "loss", "disruption", "insolvency", "penalty", "liability", "downside", "volatility", "regulatory change", "non-payment", "late payment", "shortfall"];
      const LINK_TERMS = ["contract", "clause", "indemnity", "covenant", "licence", "license", "compliance", "regulator", "regulation", "security", "guarantee", "approval", "warranty", "representation", "escrow", "sla", "force majeure", "change of control", "due diligence", "statute", "act", "condition"];
      const CONNECTIVES = ["because", "since", "therefore", "however", "under", "pursuant", "in light of", "this means", "as a result", "given that", "whereas", "which means", "consequently", "so that"];

      const evaluateTechnical = (answerText, questionText) => {
        const norm = normalizeText(answerText), qNorm = normalizeText(questionText || "");
        const words = answerText.trim().split(/\s+/).filter(Boolean).length;
        const sentences = answerText.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 3).length;
        const anchors = ["companies act", "fema", "sebi", "arbitration act", "bnss", "bns", "bsa", "ibc", "constitution", "nclt", "cci", "due diligence", "indemnity", "condition precedent", "condition subsequent", "disclosure", "clause", "warranty", "liability", "damages", "injunction", "seat", "venue", "arbitrator", "tribunal", "interim", "appeal", "jurisdiction", "rofr", "rofo", "sha", "aoa", "moa", "cirp", "coc", "ecb", "dpdp", "trademark", "patent", "moratorium", "waterfall", "escrow", "mae", "stamp duty", "partnership act", "holding out", "poem", "permanent establishment", "transfer pricing", "dtaa", "gaar", "crpc", "cpc", "safe harbour", "prog act", "contract act", "consideration"];
        const matched = anchors.filter(a => norm.includes(a));
        const qKeywords = Array.from(new Set(qNorm.split(/\W+/).filter(w => w.length > 5)));
        const qOverlap = qKeywords.filter(w => norm.includes(w)).length;
        const hasStatute = /section\s*\d+|\bact,?\s*(19|20)\d{2}\b|regulation\s*\d*|rule\s*\d+|article\s*\d+/i.test(answerText) || matched.some(a => ["companies act", "fema", "sebi", "arbitration act", "ibc", "partnership act", "dtaa", "gaar", "contract act"].includes(a));
        const conn = countTerms(norm, CONNECTIVES);
        const oneLiner = words < 12 || sentences <= 1;
        const q = distinctive(answerText);
        let a, s, r;
        if (oneLiner) { a = Math.min(25, 10 + matched.length * 5); s = hasStatute ? 20 : 5; r = 10; }
        else {
          a = Math.min(100, 20 + qOverlap * 12 + Math.min(matched.length, 4) * 10);
          s = hasStatute ? Math.min(100, 55 + matched.length * 8) : 20;
          r = Math.min(100, 20 + conn * 15 + (words >= 100 ? 25 : words >= 50 ? 15 : words >= 25 ? 5 : 0) + (sentences >= 4 ? 10 : 0));
        }
        const labels = ["Accuracy", "Backed by Statute", "Well-Reasoned"];
        let assessment, upgrade;
        if (oneLiner) {
          assessment = "A one-line answer can't be assessed as accurate or well-reasoned — partners expect a structured argument, not a soundbite.";
          upgrade = "Rebuild it as: the governing rule (with a section or case), how it applies to the facts, and the practical consequence for the client.";
        } else if (!hasStatute) {
          assessment = `${q ? `You raise "${q}", which is on the right track, but the` : "The"} answer names no provision, section or case to anchor it.`;
          upgrade = `Tie ${q ? `your point on "${q}"` : "the answer"} to the specific provision that governs it, then state the consequence.`;
        } else if (qOverlap === 0) {
          assessment = "Statutorily grounded, but it doesn't engage the specific concept the question asked about.";
          upgrade = "Restate the exact question in your first sentence, then answer it before adding background.";
        } else {
          assessment = `Solid grounding that engages the question and cites [${matched.slice(0, 3).join(", ") || "a governing provision"}].`;
          upgrade = `${q ? `Your point on "${q}" is sound — now` : "Now"} connect it to commercial consequence: who bears the risk, and what does the client do next?`;
        }
        return { type: "technical", labels, axes: [a, s, r], assessment, upgrade, oneLiner };
      };

      const evaluatePersonal = (answerText) => {
        const norm = normalizeText(answerText);
        const words = answerText.trim().split(/\s+/).filter(Boolean).length;
        const sentences = answerText.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 3).length;
        const oneLiner = words < 8 || sentences <= 1;
        const q = distinctive(answerText);
        const generic = ["good experience", "learned a lot", "hard work", "team player", "very interesting", "really enjoyed", "passionate about"];
        const gHits = generic.filter(g => norm.includes(g));
        const kws = PRACTICE_KEYWORDS[targetPractice] || [];
        const kHits = kws.filter(k => norm.includes(k)).length;
        const mentionsPractice = norm.includes(normalizeText(targetPractice).split(" ")[0]);
        const reflective = /because|since|which means|this taught|this showed|helped me|that experience|as a result|what i learned/i.test(answerText);
        let sp, tn, rf;
        if (oneLiner) { sp = 20; tn = 40; rf = 15; }
        else {
          sp = Math.max(10, Math.min(100, 30 + kHits * 15 + (words >= 40 ? 20 : words >= 20 ? 10 : 0) - gHits.length * 10));
          tn = Math.min(100, 55 + (gHits.length === 0 ? 15 : -10) + (words >= 25 ? 10 : 0));
          rf = Math.min(100, 25 + (mentionsPractice ? 25 : 0) + (reflective ? 25 : 0) + (words >= 40 ? 15 : 0));
        }
        const labels = ["Specificity", "Tone", "Reflection"];
        let assessment, upgrade;
        if (oneLiner) {
          assessment = "Too brief to judge — a one-liner here reads as disengagement, not confidence.";
          upgrade = "Give three or four sentences: what you actually did, one concrete example, and what it taught you.";
        } else if (gHits.length) {
          assessment = `You lean on a generic phrase ("${gHits[0]}") that could describe almost any internship.`;
          upgrade = `Replace "${gHits[0]}" with one specific moment, task or outcome only you experienced${q ? `, perhaps starting from your point about "${q}"` : ""}.`;
        } else if (!mentionsPractice && !reflective) {
          assessment = `${q ? `"${q}" is a good concrete detail, but the` : "The"} answer never connects back to ${targetPractice} or says what you took from it.`;
          upgrade = `Add a closing sentence linking ${q ? `"${q}"` : "this"} to ${targetPractice} — the pace, precision, or client demands it showed you.`;
        } else if (sp < 50) {
          assessment = "Well-toned, but light on concrete detail — right now it could describe almost anyone.";
          upgrade = "Name one specific task, document or matter; specificity is what separates you from every other candidate.";
        } else {
          assessment = `${q ? `The detail about "${q}" lands well, and it` : "It"} connects clearly back to ${targetPractice}.`;
          upgrade = "Lead with your strongest sentence instead of building up to it.";
        }
        return { type: "personal", labels, axes: [sp, tn, rf], assessment, upgrade, oneLiner };
      };

      const evaluateCommercial = (answerText) => {
        const norm = normalizeText(answerText);
        const words = answerText.trim().split(/\s+/).filter(Boolean).length;
        const sentences = answerText.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 3).length;
        const oneLiner = words < 15 || sentences <= 1;
        const q = distinctive(answerText);
        const b = countTerms(norm, BIZ_TERMS), r = countTerms(norm, RISK_TERMS), l = countTerms(norm, LINK_TERMS);
        const wb = words >= 90 ? 20 : words >= 45 ? 12 : words >= 25 ? 5 : 0;
        let bu, ri, ll;
        if (oneLiner) { bu = Math.min(25, 8 + b * 6); ri = Math.min(25, 8 + r * 6); ll = Math.min(25, 5 + l * 6); }
        else { bu = Math.min(100, 20 + b * 12 + wb); ri = Math.min(100, 20 + r * 12 + wb); ll = Math.min(100, 15 + l * 12 + wb); }
        const labels = ["Business Understanding", "Risk Identification", "Legal Linkage"];
        const axes = [bu, ri, ll];
        let assessment, upgrade;
        if (oneLiner) {
          assessment = "Too short to show you understand the business. Commercial questions test whether you can trace how the client earns money and where it can lose it.";
          upgrade = "Cover three steps: how the business makes money, what could go wrong and who bears the loss, and which contract term or rule protects the client.";
        } else {
          const lowest = axes.indexOf(Math.min(...axes));
          if (lowest === 0) { assessment = `${q ? `You touch on "${q}", but you` : "You"} move to risk and law without first explaining how the client earns money or who it depends on.`; upgrade = "Open with the business model — revenue source, key customers or suppliers — before discussing risk."; }
          else if (lowest === 1) { assessment = `${q ? `You describe "${q}" well, but you` : "You"} don't name the specific thing that can go wrong or who absorbs the loss.`; upgrade = "State the concrete risk (late payment, supplier failure, licence loss) and say who bears it."; }
          else { assessment = `You explain the business picture${q ? ` (including "${q}")` : ""}, but not which clause, licence or regulation protects the client.`; upgrade = "Finish by naming one contract term or regulatory rule (e.g. a covenant, indemnity, termination right or licence condition) that manages the risk."; }
          if (Math.min(...axes) >= 60) { assessment = `Strong commercial reasoning${q ? ` — the point on "${q}" ties business, risk and law together` : ""}.`; upgrade = "Sharpen it with a number or a named counterparty so the risk feels concrete."; }
        }
        return { type: "commercial", labels, axes, assessment, upgrade, oneLiner };
      };

      const evaluateFollowUp = (answerText, sent) => {
        const norm = normalizeText(answerText);
        const words = answerText.trim().split(/\s+/).filter(Boolean).length;
        const conn = countTerms(norm, CONNECTIVES);
        const reasoning = words < 10 ? 15 : Math.min(100, 25 + conn * 14 + (words >= 40 ? 20 : words >= 20 ? 10 : 0));
        const commitment = Math.min(100, sent.confidence);
        const labels = ["Reasoning under pressure", "Commitment", "—"];
        const assessment = words < 10 ? "The follow-up needed a reasoned reply, not a fragment." : sent.label === "Hesitant" ? "You kept hedging under pressure." : "You held your position under questioning.";
        const upgrade = words < 10 ? "When pushed, restate your position and give one reason for it." : sent.label === "Hesitant" ? "Pick a position, give the reason, and only then acknowledge the counter-argument." : "Good — keep the reason attached to the position.";
        return { type: "followup", labels, axes: [reasoning, commitment, Math.round((reasoning + commitment) / 2)], assessment, upgrade, oneLiner: words < 10 };
      };

      const buildFollowUp = (answerText, qObj, sent) => {
        const w = answerText.trim().split(/\s+/).filter(Boolean).length;
        const q = distinctive(answerText);
        if (sent.label === "Hesitant") return `You said${q ? ` "${q}"` : ""}, but you hedged. If I push back, what is your final position?`;
        if (w < 25) return "Walk me through your reasoning step by step — why that answer?";
        if (qObj.type === "commercial") return persona.id === "mentor" ? "Good start. Who bears the loss if that risk actually materialises?" : `You mention${q ? ` "${q}"` : " that"}. If the counterparty refuses to renegotiate, who bears the loss and what do you tell the client?`;
        if (qObj.type === "technical") return `You mentioned${q ? ` "${q}"` : " that"}. What if the counterparty refuses — what is the risk to the client and what would you do?`;
        return persona.id === "partner" ? "You say that — but what would a colleague say you actually contributed?" : "Can you give me one concrete example of that in action?";
      };

      const startInterview = () => {
        const qList = generateQuestions(persona);
        setQuestions(qList);
        setCurrentQIndex(0);
        setEvaluations([]);
        setInterviewCompleted(false);
        setShowScorecard(false);
        setAwaitingFollowUp(false);
        setMessages([{
          sender: persona.name,
          text: `${persona.opener}\n\nQuestion 1 of ${qList.length}: ${qList[0].text}`,
          timestamp: stamp()
        }]);
        setInterviewStarted(true);
        questionStartRef.current = Date.now();
      };

      const handleSend = () => {
        if (!userInput.trim() || isThinking) return;
        const answer = userInput;
        const qObj = questions[currentQIndex];
        const elapsed = Math.round((Date.now() - questionStartRef.current) / 1000);
        const wasFollowUp = awaitingFollowUp;
        setMessages(prev => [...prev, { sender: "Candidate", text: answer, timestamp: stamp() }]);
        setUserInput("");
        setIsThinking(true);

        setTimeout(() => {
          const sent = analyzeSentiment(answer, elapsed);
          const raw = wasFollowUp ? evaluateFollowUp(answer, sent)
            : qObj.type === "technical" ? evaluateTechnical(answer, qObj.text)
            : qObj.type === "commercial" ? evaluateCommercial(answer)
            : evaluatePersonal(answer);
          const adjusted = raw.axes.map(v => clamp(v + persona.offset));
          const score = clamp((raw.axes[0] + raw.axes[1] + raw.axes[2]) / 3 + persona.offset);
          const reaction = persona.reactions[sent.label] || "";
          const matrix = `GRADING MATRIX — ${raw.labels[0]}: ${adjusted[0]}/100 · ${raw.labels[1]}: ${adjusted[1]}/100${raw.labels[2] !== "—" ? ` · ${raw.labels[2]}: ${adjusted[2]}/100` : ""}`;
          const toneLine = `TONE READ: ${sent.label} (confidence ${sent.confidence}%${sent.pace ? `, pace ${sent.pace.toLowerCase()}` : ""}) — ${sent.note}`;
          const evalRecord = {
            kind: wasFollowUp ? "followup" : "main", type: raw.type, question: wasFollowUp ? "Follow-up on your previous answer" : qObj.text,
            yourAnswer: answer, score, axes: adjusted, labels: raw.labels, assessment: raw.assessment, upgrade: raw.upgrade,
            sentiment: sent, reaction, words: answer.trim().split(/\s+/).filter(Boolean).length
          };
          setEvaluations(prev => [...prev, evalRecord]);

          const feedback = `${reaction ? persona.name + ": " + reaction + "\n\n" : ""}${matrix}\n${raw.assessment}\n${toneLine}\nTACTICAL UPGRADE: ${raw.upgrade}`;

          const goNext = () => {
            const nextIndex = currentQIndex + 1;
            if (nextIndex < questions.length) {
              setCurrentQIndex(nextIndex);
              setMessages(prev => [...prev, { sender: persona.name, text: `${feedback}\n\nQuestion ${nextIndex + 1} of ${questions.length}: ${questions[nextIndex].text}`, timestamp: stamp() }]);
              questionStartRef.current = Date.now();
            } else {
              setInterviewCompleted(true);
              setMessages(prev => [...prev, { sender: persona.name, text: `${feedback}\n\nThat completes the interview. Click "View Full Scorecard" to see your scorecard and interview-presence read.`, timestamp: stamp() }]);
            }
          };

          if (!wasFollowUp && Math.random() < persona.followUpChance) {
            const fu = buildFollowUp(answer, qObj, sent);
            setAwaitingFollowUp(true);
            setMessages(prev => [...prev, { sender: persona.name, text: `${feedback}\n\nFollow-up: ${fu}`, timestamp: stamp() }]);
            questionStartRef.current = Date.now();
          } else {
            setAwaitingFollowUp(false);
            goNext();
          }
          if (wasFollowUp) setAwaitingFollowUp(false);
          setIsThinking(false);
        }, persona.delay);
      };

      const avgInterviewScore = evaluations.length > 0 ? Math.round(evaluations.reduce((a, e) => a + e.score, 0) / evaluations.length) : 0;

      // Interview-presence summary from tone reads
      const presence = (() => {
        if (!evaluations.length) return null;
        const counts = {};
        evaluations.forEach(e => { counts[e.sentiment.label] = (counts[e.sentiment.label] || 0) + 1; });
        const dominant = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
        const avgConf = Math.round(evaluations.reduce((a, e) => a + e.sentiment.confidence, 0) / evaluations.length);
        const hedges = evaluations.reduce((a, e) => a + e.sentiment.hedge, 0);
        const paced = evaluations.filter(e => e.sentiment.pace).map(e => e.sentiment.pace);
        const slow = paced.filter(p => p === "Slow").length;
        return { counts, dominant, avgConf, hedges, slow };
      })();

      const typeBadge = (e) => e.kind === "followup" ? "Follow-up" : e.type === "technical" ? "Technical" : e.type === "commercial" ? "Commercial" : "Personal / CV";
      const badgeClass = (e) => e.kind === "followup" ? "bg-amber-100 text-amber-800" : e.type === "technical" ? "bg-navy-800 text-white" : e.type === "commercial" ? "bg-accent-500 text-white" : "bg-navy-200 text-navy-800";
      const mainCount = questions.length;
      const answeredMain = evaluations.filter(e => e.kind === "main").length;

      return (
        <div className="space-y-6 fade-up">

          <div className="card p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold tracking-tight text-ink">Mock Interview Simulator</h2>
              <p className="text-xs text-brandGrey mt-1">A live simulation with an in-character interviewer, follow-up pressure, and a tone read on every answer.</p>
            </div>
            {interviewStarted && !interviewCompleted && (
              <button 
                onClick={() => setShowExitModal(true)}
                className="border border-brandLightGrey px-4 py-2 text-xs font-semibold rounded-lg hover:bg-navy-800 hover:text-white hover:border-navy-800 transition-colors"
              >
                Abandon Interview
              </button>
            )}
          </div>

          {!interviewStarted ? (
            <div className="card p-8 space-y-6">
              <div className="space-y-3">
                <span className="text-[10px] font-bold uppercase tracking-wider text-brandGrey">Choose your interviewer</span>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {INTERVIEW_PERSONAS.map(p => (
                    <button key={p.id} onClick={() => setPersonaId(p.id)}
                      className={`text-left border rounded-xl p-4 transition-colors ${personaId === p.id ? "border-navy-800 bg-navy-50" : "border-brandLightGrey hover:bg-surface"}`}>
                      <div className="flex items-center justify-between gap-2 mb-1">
                        <span className="text-sm font-bold text-ink">{p.name}</span>
                        <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${p.difficulty === "Easier" ? "bg-green-100 text-green-800" : p.difficulty === "Standard" ? "bg-navy-100 text-navy-800" : "bg-red-100 text-red-700"}`}>{p.difficulty}</span>
                      </div>
                      <p className="text-[11px] text-brandGrey leading-relaxed">{p.blurb}</p>
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs font-mono">
                <div className="p-3 bg-navy-50 rounded-lg">
                  <span className="text-brandGrey block">Practice Area</span>
                  <span className="font-bold text-ink">{targetPractice}</span>
                </div>
                <div className="p-3 bg-navy-50 rounded-lg md:col-span-2">
                  <span className="text-brandGrey block">Industries in focus (from your CV &amp; practice)</span>
                  <span className="font-bold text-ink">{industries.slice(0, 3).join(" · ") || "General business"}</span>
                </div>
              </div>

              <div className="p-4 bg-navy-50 rounded-xl text-xs space-y-2">
                <span className="font-bold uppercase text-ink">How this works</span>
                <p className="text-brandGrey leading-relaxed">
                  Ten questions mixing your own CV, commercial awareness of the industries you have touched, and {targetPractice} technicals. Every answer gets a tone read (confident, hesitant, defensive…) and the interviewer reacts in character — {persona.name} {persona.followUpChance >= 0.6 ? "will often push back with follow-ups" : "will sometimes follow up on your answers"}. Scoring is adjusted for the persona's difficulty ({persona.offset > 0 ? "+" : ""}{persona.offset}).
                </p>
              </div>

              <button 
                onClick={startInterview}
                className="bg-navy-800 text-white px-6 py-3 text-xs font-semibold rounded-lg hover:bg-navy-700 transition-colors w-full shadow-sm"
              >
                Start Interview with {persona.name}
              </button>
            </div>
          ) : showScorecard ? (
            <div className="space-y-6 fade-up">
              <div className="card p-8 text-center space-y-3">
                <span className="text-[11px] font-semibold uppercase tracking-wide text-brandGrey">Interview Scorecard</span>
                <div className="text-4xl font-extrabold text-navy-800">{avgInterviewScore} / 100</div>
                <p className="text-xs text-brandGrey">{persona.name} ({persona.difficulty}) · {targetPractice}</p>
              </div>

              {presence && (
                <div className="card p-6 space-y-3">
                  <h3 className="text-sm font-semibold text-ink border-b border-rule pb-3">Interview Presence (tone analysis)</h3>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                    <div className="p-3 bg-navy-50 rounded-lg"><span className="text-brandGrey block">Dominant tone</span><span className="font-bold text-ink">{presence.dominant}</span></div>
                    <div className="p-3 bg-navy-50 rounded-lg"><span className="text-brandGrey block">Avg. confidence</span><span className="font-bold text-ink">{presence.avgConf}%</span></div>
                    <div className="p-3 bg-navy-50 rounded-lg"><span className="text-brandGrey block">Hedging phrases</span><span className="font-bold text-ink">{presence.hedges}</span></div>
                    <div className="p-3 bg-navy-50 rounded-lg"><span className="text-brandGrey block">Slow answers</span><span className="font-bold text-ink">{presence.slow}</span></div>
                  </div>
                  <div className="flex flex-wrap gap-2 pt-1">
                    {Object.entries(presence.counts).map(([label, n]) => (
                      <span key={label} className="text-[11px] font-semibold bg-surface border border-rule rounded-full px-3 py-1">{label} × {n}</span>
                    ))}
                  </div>
                </div>
              )}

              <div className="card p-6 space-y-3">
                <h3 className="text-sm font-semibold text-ink border-b border-rule pb-3">Question-by-Question Review</h3>
                <div className="space-y-3">
                  {evaluations.map((ev, i) => (
                    <div key={i} className="border border-rule rounded-xl p-4 bg-surface/60 text-xs space-y-1.5">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className={`text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full ${badgeClass(ev)}`}>{typeBadge(ev)}</span>
                          <span className="text-[10px] font-semibold text-brandGrey">Tone: {ev.sentiment.label}</span>
                        </div>
                        <span className="font-mono font-semibold text-navy-800 shrink-0">{ev.score}/100</span>
                      </div>
                      <p className="text-ink font-medium">{ev.question}</p>
                      <p className="text-brandGrey italic">"{ev.yourAnswer}"</p>
                      <p className="text-brandGrey font-mono text-[10px]">{ev.labels[0]} {ev.axes[0]} · {ev.labels[1]} {ev.axes[1]}{ev.labels[2] !== "—" ? ` · ${ev.labels[2]} ${ev.axes[2]}` : ""}</p>
                      <p className="text-ink">{ev.assessment}</p>
                      <p className="text-navy-700">Upgrade: {ev.upgrade}</p>
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex gap-3">
                <button onClick={() => setShowScorecard(false)} className="border border-brandLightGrey px-6 py-2.5 text-xs font-semibold rounded-lg hover:bg-navy-800 hover:text-white hover:border-navy-800 transition-colors flex-1">
                  Back to Transcript
                </button>
                <button onClick={() => { setInterviewStarted(false); setShowScorecard(false); setMessages([]); }} className="bg-navy-800 text-white px-6 py-2.5 text-xs font-semibold rounded-lg hover:bg-navy-700 transition-colors flex-1">
                  New Interview (fresh questions)
                </button>
              </div>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

              <div className="md:col-span-2 card flex flex-col h-[600px] overflow-hidden">
                <div className="p-3 border-b border-rule bg-bgOffwhite flex justify-between items-center text-xs">
                  <span className="font-bold uppercase">Question {Math.min(currentQIndex + 1, mainCount)}/{mainCount}{awaitingFollowUp ? " · follow-up" : ""}</span>
                  <span className="font-mono text-brandGrey">{persona.name} · {persona.difficulty}</span>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-4 font-mono text-xs">
                  {messages.map((m, idx) => (
                    <div key={idx} className={`flex flex-col ${m.sender === "Candidate" ? "items-end" : "items-start"}`}>
                      <div className="flex items-center space-x-2 text-[10px] text-brandGrey mb-1">
                        <span className="font-bold text-ink">{m.sender}</span>
                        <span>• {m.timestamp}</span>
                      </div>
                      <div className={`p-3 max-w-xl border ${
                        m.sender === "Candidate" 
                          ? "bg-navy-800 text-white border-navy-800 rounded-2xl rounded-tr-sm" 
                          : "bg-surface text-ink border-rule rounded-2xl rounded-tl-sm"
                      } whitespace-pre-wrap leading-relaxed`}>
                        {m.text}
                      </div>
                    </div>
                  ))}

                  {isThinking && (
                    <div className="flex items-center space-x-2 text-xs text-brandGrey italic py-2">
                      <Icon name="sparkles" className="w-4 h-4 animate-spin text-ink" />
                      <span>{persona.name} is considering your answer...</span>
                    </div>
                  )}
                </div>

                {!interviewCompleted ? (
                  <div className="p-3 border-t border-rule bg-bgOffwhite flex space-x-2">
                    <input 
                      type="text"
                      className="flex-1 bg-white border border-brandLightGrey rounded-lg p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-accent-500"
                      placeholder="Type your answer here..."
                      value={userInput}
                      onChange={e => setUserInput(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && handleSend()}
                    />
                    <button 
                      onClick={handleSend}
                      className="bg-navy-800 text-white px-4 py-2 text-xs font-semibold rounded-lg hover:bg-navy-700 transition-colors"
                    >
                      Send
                    </button>
                  </div>
                ) : (
                  <div className="p-4 border-t border-rule bg-bgOffwhite text-center">
                    <button
                      onClick={() => setShowScorecard(true)}
                      className="bg-navy-800 text-white px-6 py-2.5 text-xs font-semibold rounded-lg hover:bg-navy-700 transition-colors"
                    >
                      View Full Scorecard
                    </button>
                  </div>
                )}
              </div>

              <div className="card p-4 space-y-4 overflow-y-auto h-[600px]">
                <h3 className="text-xs font-bold uppercase border-b border-rule pb-3 text-ink">
                  Realtime Evaluation
                </h3>

                {evaluations.length === 0 ? (
                  <div className="text-xs text-brandGrey italic py-4">
                    Submit an answer to see your grading matrix and tone read.
                  </div>
                ) : (
                  <div className="space-y-3 font-mono text-[11px]">
                    {evaluations.map((ev, i) => (
                      <div key={i} className="p-3 bg-navy-50 rounded-lg space-y-1">
                        <div className="flex justify-between font-bold">
                          <span>{typeBadge(ev)}</span>
                          <span className="text-ink">{ev.score}/100</span>
                        </div>
                        <div className="text-brandGrey text-[10px]">Tone: {ev.sentiment.label} · {ev.words} words</div>
                        <div className="text-ink pt-1">{ev.assessment}</div>
                      </div>
                    ))}
                  </div>
                )}

                {interviewCompleted && (
                  <div className="pt-4 border-t border-rule space-y-3">
                    <div className="p-4 bg-navy-800 text-white text-center space-y-1 rounded-xl">
                      <span className="text-[10px] uppercase font-bold tracking-wider text-navy-200">Overall Interview Performance</span>
                      <div className="text-3xl font-extrabold">{avgInterviewScore} / 100</div>
                    </div>
                    <button
                      onClick={() => setShowScorecard(true)}
                      className="w-full bg-navy-50 text-navy-800 px-4 py-2 text-xs font-semibold rounded-lg hover:bg-navy-100 transition-colors"
                    >
                      View Full Scorecard →
                    </button>
                  </div>
                )}
              </div>

            </div>
          )}

          {showExitModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="card p-6 max-w-md w-full space-y-4">
                <h3 className="text-sm font-bold uppercase text-ink">Abandon Current Run?</h3>
                <p className="text-xs text-brandGrey">
                  All progress in this interview will be lost. Do you wish to return to the interviewer selection?
                </p>
                <div className="flex justify-end space-x-2 pt-2">
                  <button 
                    onClick={() => setShowExitModal(false)}
                    className="px-4 py-2 border border-brandLightGrey rounded-lg text-xs font-semibold hover:bg-surface transition-colors"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => {
                      setShowExitModal(false);
                      setInterviewStarted(false);
                      setMessages([]);
                      setAwaitingFollowUp(false);
                    }}
                    className="px-4 py-2 bg-navy-800 text-white rounded-lg text-xs font-semibold hover:bg-navy-700 transition-colors"
                  >
                    Confirm Abandon
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    // --- MODULE 3B: QUALIFICATION TEST — timed, multi-stage, end-to-end readiness certification ---
    const QUALIFICATION_TOTAL_SECONDS = 300; // 5 minutes, hard cap across the entire flow

    const QualificationTest = ({ profile }) => {
      const targetPractice = profile.targetPractice || "General Corporate";

      const shuffleArr = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };

      const [stage, setStage] = useState("intro"); // intro | objective | interview | readiness | results
      const [timeLeft, setTimeLeft] = useState(QUALIFICATION_TOTAL_SECONDS);
      const [running, setRunning] = useState(false);
      const [timedOut, setTimedOut] = useState(false);

      // A fresh, randomised subset is drawn from the (larger) banks EVERY time the interview begins,
      // so no two attempts show the same fixed sequence.
      const drawObjectiveQs = () => shuffleArr(GENERAL_QUALIFICATION_MCQ).slice(0, 10);
      const drawReadinessQs = () => {
        const pool = PRACTICE_READINESS_MCQ[targetPractice] || PRACTICE_READINESS_MCQ["General Corporate"];
        return shuffleArr(pool).slice(0, Math.min(10, pool.length));
      };
      const drawInterviewQs = () => {
        const topics = PRACTICE_AREA_TOPIC_MAP[targetPractice] || PRACTICE_AREA_TOPIC_MAP["General Corporate"];
        const pool = [];
        topics.forEach(t => (TECHNICAL_QUESTIONS_BY_TOPIC[t] || []).forEach(q => pool.push(q)));
        const shuffled = shuffleArr(pool);
        const commercial = shuffleArr(COMMERCIAL_QUESTIONS_FLAT)[0];
        return [shuffleArr(HR_QUESTIONS)[0], commercial, shuffled[0]];
      };

      const [objQuestions, setObjQuestions] = useState(() => drawObjectiveQs());
      const [objIndex, setObjIndex] = useState(0);
      const [objAnswers, setObjAnswers] = useState(() => Array(10).fill(null));

      const [interviewQs, setInterviewQs] = useState(() => drawInterviewQs());
      const [interviewIndex, setInterviewIndex] = useState(0);
      const [interviewAnswers, setInterviewAnswers] = useState(() => Array(3).fill(""));

      const [readinessQs, setReadinessQs] = useState(() => drawReadinessQs());
      const [readIndex, setReadIndex] = useState(0);
      const [readAnswers, setReadAnswers] = useState(() => Array(10).fill(null));

      // Global 5-minute countdown — runs across every stage once the interview begins.
      useEffect(() => {
        if (!running) return;
        if (timeLeft <= 0) { setTimedOut(true); setStage("results"); setRunning(false); return; }
        const t = setTimeout(() => setTimeLeft(tl => tl - 1), 1000);
        return () => clearTimeout(t);
      }, [running, timeLeft]);

      const fmtTime = (s) => `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, "0")}`;

      const beginTest = () => {
        const newObjQs = drawObjectiveQs();
        const newInterviewQs = drawInterviewQs();
        const newReadinessQs = drawReadinessQs();
        setStage("objective");
        setRunning(true);
        setTimeLeft(QUALIFICATION_TOTAL_SECONDS);
        setTimedOut(false);
        setObjQuestions(newObjQs);
        setObjIndex(0); setObjAnswers(Array(newObjQs.length).fill(null));
        setInterviewQs(newInterviewQs);
        setInterviewIndex(0); setInterviewAnswers(Array(newInterviewQs.length).fill(""));
        setReadinessQs(newReadinessQs);
        setReadIndex(0); setReadAnswers(Array(newReadinessQs.length).fill(null));
      };

      // --- Derived scoring (computed fresh every render, so Back + re-answer never double-counts) ---
      const buildResults = () => {
        const items = [];
        objAnswers.forEach((sel, i) => {
          if (sel === null || !objQuestions[i]) return;
          const q = objQuestions[i];
          const correct = sel === q.answer;
          items.push({
            round: "Fundamentals & Commercial Round", type: "mcq", question: q.q,
            yourAnswer: q.options[sel], correctAnswer: q.options[q.answer], correct,
            gained: correct ? 5 : 0, possible: 5
          });
        });
        interviewAnswers.forEach((ans, i) => {
          if (!ans || !ans.trim()) return;
          const raw = scoreOpenAnswer(ans);
          const scaled = Math.round((raw / 100) * 20);
          const norm = normalizeText(ans);
          const matched = OPEN_ANSWER_ANCHORS.filter(a => norm.includes(a));
          const sent = analyzeSentiment(ans);
          items.push({
            round: "Interview Questions", type: "open", question: interviewQs[i],
            yourAnswer: ans, gained: scaled, possible: 20,
            note: `Tone read: ${sent.label}. ${sent.note}` + (matched.length > 0 ? ` Referenced: ${matched.slice(0, 3).join(", ")}.` : "")
          });
        });
        readAnswers.forEach((sel, i) => {
          if (sel === null || !readinessQs[i]) return;
          const q = readinessQs[i];
          const correct = sel === q.answer;
          items.push({
            round: `${targetPractice} Readiness Round`, type: "mcq", question: q.q,
            yourAnswer: q.options[sel], correctAnswer: q.options[q.answer], correct,
            gained: correct ? 10 : 0, possible: 10
          });
        });

        const earned = items.reduce((a, i) => a + i.gained, 0);
        const possible = items.reduce((a, i) => a + i.possible, 0);
        const pct = possible > 0 ? Math.round((earned / possible) * 100) : 0;

        let placementBand = "Rolling Placements Pool";
        let bandNote = "Foundational gaps remain — keep drilling technical fundamentals and commercial awareness before your next attempt.";
        if (pct >= 85) { placementBand = "Day 0"; bandNote = "Elite interview readiness — you are positioned for first-wave, Day-Zero recruitment slots."; }
        else if (pct >= 70) { placementBand = "Day 1"; bandNote = "Strong interview readiness — competitive for Day-One recruitment slots at most firms."; }
        else if (pct >= 55) { placementBand = "Day 2"; bandNote = "Developing interview readiness — likely to clear Day-Two/boutique-tier recruitment slots."; }

        return { items, earned, possible, pct, placementBand, bandNote };
      };

      const results = stage === "results" ? buildResults() : null;

      // Persist a report to the Dashboard whenever the results screen is reached (completion or timeout).
      useEffect(() => {
        if (stage !== "results" || !results) return;
        try {
          const report = {
            date: new Date().toISOString(),
            practiceArea: targetPractice,
            targetEmployer: profile.targetEmployer || "Undecided",
            placementBand: results.placementBand,
            bandNote: results.bandNote,
            pct: results.pct,
            earned: results.earned,
            possible: results.possible,
            timedOut,
            items: results.items.map(i => ({
              round: i.round, type: i.type, question: i.question,
              yourAnswer: i.yourAnswer, correctAnswer: i.correctAnswer || null,
              correct: i.correct === undefined ? null : i.correct,
              gained: i.gained, possible: i.possible, note: i.note || null
            }))
          };
          localStorage.setItem("placement_os_qualification_report", JSON.stringify(report));
        } catch (e) { /* best-effort — never block the results screen on a storage failure */ }
      }, [stage]);

      const progressStages = ["objective", "interview", "readiness", "results"];
      const stageLabels = { objective: "Fundamentals", interview: "Interview Questions", readiness: "Readiness Round", results: "Results" };

      // --- Navigation helpers (every stage has a Back option once the interview has begun) ---
      const goBack = () => {
        if (stage === "objective") {
          if (objIndex > 0) setObjIndex(objIndex - 1);
        } else if (stage === "interview") {
          if (interviewIndex > 0) setInterviewIndex(interviewIndex - 1);
          else { setStage("objective"); setObjIndex(objQuestions.length - 1); }
        } else if (stage === "readiness") {
          if (readIndex > 0) setReadIndex(readIndex - 1);
          else { setStage("interview"); setInterviewIndex(interviewQs.length - 1); }
        }
      };
      const canGoBack = stage === "objective" ? objIndex > 0 : ["interview", "readiness"].includes(stage);

      const selectObj = (i) => { const u = [...objAnswers]; u[objIndex] = i; setObjAnswers(u); };
      const nextObj = () => {
        if (objAnswers[objIndex] === null) return;
        if (objIndex + 1 < objQuestions.length) setObjIndex(objIndex + 1);
        else setStage("interview");
      };

      const setInterviewAnswerAt = (val) => { const u = [...interviewAnswers]; u[interviewIndex] = val; setInterviewAnswers(u); };
      const nextInterview = () => {
        if (!interviewAnswers[interviewIndex] || !interviewAnswers[interviewIndex].trim()) return;
        if (interviewIndex + 1 < interviewQs.length) setInterviewIndex(interviewIndex + 1);
        else setStage("readiness");
      };

      const selectRead = (i) => { const u = [...readAnswers]; u[readIndex] = i; setReadAnswers(u); };
      const nextRead = () => {
        if (readAnswers[readIndex] === null) return;
        if (readIndex + 1 < readinessQs.length) setReadIndex(readIndex + 1);
        else { setRunning(false); setStage("results"); }
      };

      const BackButton = () => canGoBack ? (
        <button onClick={goBack} className="px-4 py-2.5 border border-brandLightGrey rounded-lg text-xs font-semibold text-ink hover:bg-navy-800 hover:text-white hover:border-navy-800 transition-colors flex items-center gap-1.5">
          <Icon name="arrowLeft" className="w-3.5 h-3.5" />
          Back
        </button>
      ) : <div></div>;

      return (
        <div className="space-y-6 fade-up">
          <div className="card p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold tracking-tight text-ink">Qualification Interview</h2>
              <p className="text-xs text-brandGrey mt-1">A timed interview: Fundamentals &amp; Commercial Round → Interview Questions → {targetPractice} Readiness Round.</p>
            </div>
            {running && (
              <div className={`px-4 py-2 rounded-lg font-mono text-sm font-bold ${timeLeft <= 30 ? "bg-red-50 text-red-600" : "bg-navy-50 text-navy-800"}`}>
                {fmtTime(timeLeft)} remaining
              </div>
            )}
          </div>

          {stage !== "intro" && stage !== "results" && (
            <div className="card p-4">
              <div className="flex items-center justify-between text-[11px] font-semibold text-brandGrey mb-2">
                {progressStages.slice(0, 3).map(s => (
                  <span key={s} className={stage === s ? "text-navy-800" : ""}>{stageLabels[s]}</span>
                ))}
              </div>
              <div className="w-full h-1.5 bg-brandLightGrey rounded-full overflow-hidden">
                <div className="h-full bg-navy-800 transition-all duration-500" style={{ width: `${(progressStages.indexOf(stage) / 3) * 100}%` }}></div>
              </div>
            </div>
          )}

          {stage === "intro" && (
            <div className="card p-8 space-y-6">
              <div className="p-4 bg-navy-50 rounded-xl text-xs space-y-2">
                <span className="font-semibold text-ink uppercase tracking-wide">How this interview works</span>
                <ul className="list-disc pl-4 space-y-1 text-brandGrey">
                  <li><strong>Fundamentals &amp; Commercial Round</strong> — 10 randomly drawn legal and business-awareness MCQs (5 pts each).</li>
                  <li><strong>Interview Questions</strong> — 3 open questions (one HR, one commercial-awareness, one technical); scored for substance and read for tone.</li>
                  <li><strong>{targetPractice} Readiness Round</strong> — 10 randomly drawn practice-specific MCQs (10 pts each).</li>
                </ul>
                <p className="text-brandGrey pt-2">
                  One <strong>5-minute</strong> window for the whole interview. If time expires, it stops and you are graded on everything attempted. Use <strong>Back</strong> to revise an earlier answer — it never counts twice. Every attempt draws a fresh set of questions.
                </p>
              </div>
              <button onClick={beginTest} className="bg-navy-800 text-white px-6 py-3 text-xs font-semibold rounded-lg hover:bg-navy-700 transition-colors w-full shadow-sm">
                Begin Qualification Interview (5:00)
              </button>
            </div>
          )}

          {stage === "objective" && objQuestions[objIndex] && (
            <div className="card p-8 space-y-5">
              <span className="text-[11px] font-semibold uppercase tracking-wide text-brandGrey">Fundamentals &amp; Commercial — Question {objIndex + 1} of {objQuestions.length}</span>
              <h3 className="text-base font-semibold text-ink">{objQuestions[objIndex].q}</h3>
              <div className="space-y-2">
                {objQuestions[objIndex].options.map((opt, i) => (
                  <button key={i} onClick={() => selectObj(i)}
                    className={`w-full text-left text-xs p-3 rounded-lg border transition-colors ${objAnswers[objIndex] === i ? "border-navy-800 bg-navy-50 font-semibold" : "border-brandLightGrey hover:bg-surface"}`}>
                    {opt}
                  </button>
                ))}
              </div>
              <div className="flex items-center justify-between gap-3">
                <BackButton />
                <button onClick={nextObj} disabled={objAnswers[objIndex] === null}
                  className={`px-6 py-2.5 text-xs font-semibold rounded-lg transition-colors ${objAnswers[objIndex] === null ? "bg-brandLightGrey text-brandGrey cursor-not-allowed" : "bg-navy-800 text-white hover:bg-navy-700"}`}>
                  {objIndex + 1 < objQuestions.length ? "Next Question" : "Proceed to Interview Questions"}
                </button>
              </div>
            </div>
          )}

          {stage === "interview" && (
            <div className="card p-8 space-y-5">
              <span className="text-[11px] font-semibold uppercase tracking-wide text-brandGrey">Interview Questions — Question {interviewIndex + 1} of {interviewQs.length}</span>
              <h3 className="text-base font-semibold text-ink">{interviewQs[interviewIndex]}</h3>
              <textarea
                rows="5"
                className="w-full bg-white border border-brandLightGrey rounded-lg p-3 text-xs focus:outline-none focus:ring-2 focus:ring-accent-500"
                placeholder="Answer as you would in the room..."
                value={interviewAnswers[interviewIndex]}
                onChange={e => setInterviewAnswerAt(e.target.value)}
              />
              <div className="flex items-center justify-between gap-3">
                <BackButton />
                <button onClick={nextInterview} disabled={!interviewAnswers[interviewIndex] || !interviewAnswers[interviewIndex].trim()}
                  className={`px-6 py-2.5 text-xs font-semibold rounded-lg transition-colors ${(!interviewAnswers[interviewIndex] || !interviewAnswers[interviewIndex].trim()) ? "bg-brandLightGrey text-brandGrey cursor-not-allowed" : "bg-navy-800 text-white hover:bg-navy-700"}`}>
                  {interviewIndex + 1 < interviewQs.length ? "Submit & Next Question" : "Proceed to Readiness Round"}
                </button>
              </div>
            </div>
          )}

          {stage === "readiness" && readinessQs[readIndex] && (
            <div className="card p-8 space-y-5">
              <span className="text-[11px] font-semibold uppercase tracking-wide text-brandGrey">{targetPractice} Readiness Round — Question {readIndex + 1} of {readinessQs.length}</span>
              <h3 className="text-base font-semibold text-ink">{readinessQs[readIndex].q}</h3>
              <div className="space-y-2">
                {readinessQs[readIndex].options.map((opt, i) => (
                  <button key={i} onClick={() => selectRead(i)}
                    className={`w-full text-left text-xs p-3 rounded-lg border transition-colors ${readAnswers[readIndex] === i ? "border-navy-800 bg-navy-50 font-semibold" : "border-brandLightGrey hover:bg-surface"}`}>
                    {opt}
                  </button>
                ))}
              </div>
              <div className="flex items-center justify-between gap-3">
                <BackButton />
                <button onClick={nextRead} disabled={readAnswers[readIndex] === null}
                  className={`px-6 py-2.5 text-xs font-semibold rounded-lg transition-colors ${readAnswers[readIndex] === null ? "bg-brandLightGrey text-brandGrey cursor-not-allowed" : "bg-navy-800 text-white hover:bg-navy-700"}`}>
                  {readIndex + 1 < readinessQs.length ? "Next Question" : "Finish & View Results"}
                </button>
              </div>
            </div>
          )}

          {stage === "results" && results && (
            <div className="space-y-6">
              <div className="card p-8 text-center space-y-3">
                <span className="text-[11px] font-semibold uppercase tracking-wide text-brandGrey">Qualification Interview Result</span>
                <div className="text-4xl font-extrabold text-navy-800">{results.placementBand}</div>
                <p className="text-xs text-brandGrey max-w-lg mx-auto">{results.bandNote}</p>
                <div className="text-sm font-mono text-ink pt-2">{results.earned} / {results.possible} pts attempted ({results.pct}%)</div>
                {timedOut && <div className="text-[11px] text-red-600 font-semibold">Time expired — graded on all questions attempted before the 5-minute window closed.</div>}
                <div className="text-[11px] text-navy-700 font-semibold pt-1">✓ This report has been saved to your Dashboard so you can review it later.</div>
              </div>

              <div className="card p-6 space-y-3">
                <h3 className="text-sm font-semibold text-ink border-b border-rule pb-3">Where You Went Wrong — Full Review</h3>
                {results.items.length === 0 ? (
                  <div className="text-xs text-brandGrey italic">No questions were attempted.</div>
                ) : (
                  <div className="space-y-2">
                    {results.items.map((item, i) => (
                      <div key={i} className={`border rounded-xl p-3 text-xs ${item.correct === false ? "border-red-200 bg-red-50/50" : "border-rule bg-surface/60"}`}>
                        <div className="flex items-start justify-between gap-2 mb-1">
                          <span className="text-[10px] font-semibold uppercase tracking-wide text-brandGrey">{item.round}</span>
                          <span className={`font-mono font-semibold shrink-0 ${item.correct === false ? "text-red-600" : "text-navy-800"}`}>{item.gained}/{item.possible}</span>
                        </div>
                        <p className="text-ink font-medium mb-1">{item.question}</p>
                        <p className="text-brandGrey">Your answer: <span className="text-ink">{item.yourAnswer}</span></p>
                        {item.correct === false && item.correctAnswer && (
                          <p className="text-red-700 mt-1">Correct answer: <strong>{item.correctAnswer}</strong></p>
                        )}
                        {item.note && <p className="text-brandGrey mt-1 italic">{item.note}</p>}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <button onClick={beginTest} className="border border-brandLightGrey px-6 py-2.5 text-xs font-semibold rounded-lg hover:bg-navy-800 hover:text-white hover:border-navy-800 transition-colors w-full">
                Retake with a fresh question set
              </button>
            </div>
          )}
        </div>
      );
    };

    // --- MODULE 3D: DAY ZERO ASSIGNMENTS — industry case studies + commercial awareness (gamified) ---
    const DayZeroAssignments = ({ profile }) => {
      const [dz, setDz] = useState(() => loadDayZero());
      const [view, setView] = useState("list"); // list | case | result
      const [activeCase, setActiveCase] = useState(null);
      const [step, setStep] = useState(0); // 0 snapshot, 1-2 mcq, 3 open
      const [mcqSets, setMcqSets] = useState([]);
      const [picked, setPicked] = useState([null, null]);
      const [openText, setOpenText] = useState("");
      const [openResult, setOpenResult] = useState(null);
      const [result, setResult] = useState(null);
      const [filter, setFilter] = useState("Recommended");

      const shuffleArr = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      const industries = detectIndustries(profile);
      const cvIndustries = industries.filter(i => (INDUSTRY_KEYWORDS[i] || []).length && detectIndustries({ ...profile, targetPractice: "" }).includes(i));
      const level = dzLevel(dz.xp);
      const cs = dzCommercialScore(dz);

      const casesSorted = [...DAY_ZERO_CASES].sort((a, b) => {
        const ia = industries.indexOf(a.industry), ib = industries.indexOf(b.industry);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
      const visible = filter === "Recommended" ? casesSorted : filter === "All" ? casesSorted : casesSorted.filter(c => c.industry === filter);

      const startCase = (cs0) => {
        // shuffle option order per attempt so position is never a tell
        const sets = cs0.questions.filter(q => q.type === "mcq").map(q => {
          const opts = shuffleArr([q.correct, ...q.wrong]);
          return { options: opts, answer: opts.indexOf(q.correct) };
        });
        setMcqSets(sets);
        setActiveCase(cs0);
        setStep(0); setPicked([null, null]); setOpenText(""); setOpenResult(null); setResult(null);
        setView("case");
      };

      const mcqQs = activeCase ? activeCase.questions.filter(q => q.type === "mcq") : [];
      const openQ = activeCase ? activeCase.questions.find(q => q.type === "open") : null;

      const pickOption = (qi, oi) => {
        if (picked[qi] !== null) return;
        const u = [...picked]; u[qi] = oi; setPicked(u);
      };

      const submitOpen = () => {
        if (!openText.trim() || openResult) return;
        const norm = normalizeText(openText);
        const words = norm.split(" ").filter(Boolean).length;
        const covered = openQ.rubric.map(r => ({ label: r.label, hit: words >= 8 && r.keywords.some(k => norm.includes(normalizeText(k))) }));
        setOpenResult({ covered, tone: analyzeSentiment(openText) });
      };

      const finishCase = () => {
        const mcqCorrect = picked.filter((p, i) => p !== null && p === mcqSets[i].answer).length;
        const rubricCovered = openResult ? openResult.covered.filter(c => c.hit).length : 0;
        const score = mcqCorrect * 10 + rubricCovered * 10;
        const max = mcqQs.length * 10 + openQ.rubric.length * 10;

        const today = new Date().toISOString().slice(0, 10);
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        let streak = dz.streak || 0;
        if (dz.lastDay !== today) streak = dz.lastDay === yesterday ? streak + 1 : 1;

        const firstTime = !dz.completed[activeCase.id];
        const streakBonus = Math.min(streak, 5) * 5;
        const gross = score + 15 + streakBonus;
        const earned = firstTime ? gross : Math.round(gross * 0.25);

        const completed = { ...dz.completed, [activeCase.id]: firstTime || score >= dz.completed[activeCase.id].score
          ? { score, max, mcq: mcqCorrect, rubric: rubricCovered, industry: activeCase.industry, date: today }
          : dz.completed[activeCase.id] };
        const vals = Object.values(completed);
        const badgeDefs = [
          ["First Case Closed", vals.length >= 1],
          ["Risk Spotter", vals.filter(v => v.mcq === 2).length >= 2],
          ["Value Chain Mapper", vals.some(v => v.rubric >= 3)],
          ["3-Day Streak", streak >= 3],
          ["Industry Explorer", new Set(vals.map(v => v.industry)).size >= 3],
          ["Commercially Ready", vals.length >= 5 && (vals.reduce((a, v) => a + v.score, 0) / vals.reduce((a, v) => a + v.max, 0)) >= 0.75]
        ];
        const earnedBadges = badgeDefs.filter(([, ok]) => ok).map(([n]) => n);
        const newBadges = earnedBadges.filter(b => !(dz.badges || []).includes(b));
        const next = { xp: dz.xp + earned, streak, lastDay: today, completed, badges: Array.from(new Set([...(dz.badges || []), ...earnedBadges])) };
        saveDayZero(next);
        setDz(next);
        setResult({ mcqCorrect, rubricCovered, score, max, earned, streak, streakBonus, newBadges, firstTime });
        setView("result");

        mootsText: "",
        publicationsText: "",
        leadershipEntries: [],
        certificationsText: "",
        electivesText: "",
        locationText: "",
        preferredFirmsText: "",
        internshipWork: {},
        targetEmployer: "Undecided",
        targetPractice: ""
      };

      const [profile, setProfile] = useState(() => {
        try {
          const saved = localStorage.getItem("placement_os_profile");
          if (!saved) return defaultProfile;
          const parsed = JSON.parse(saved);
          const merged = { ...defaultProfile, ...parsed };
          // Migrate legacy freeform leadershipText into the new leadershipEntries list, once.
          if (!Array.isArray(merged.leadershipEntries) || merged.leadershipEntries.length === 0) {
            if (typeof parsed.leadershipText === "string" && parsed.leadershipText.trim()) {
              merged.leadershipEntries = parsed.leadershipText.split(/[\n;]/).map(s => s.trim()).filter(Boolean);
            }
          }
          return merged;
        } catch (e) {
          return defaultProfile;
        }
      });

      const [onboarded, setOnboarded] = useState(() => {
        try {
          return localStorage.getItem("placement_os_onboarded") === "true";
        } catch (e) {
          return false;
        }
      });

      const [activeTab, setActiveTab] = useState("dashboard");
      const [showRestartModal, setShowRestartModal] = useState(false);

      // Persistence to LocalStorage
      useEffect(() => {
        try { localStorage.setItem("placement_os_profile", JSON.stringify(profile)); } catch (e) {}
      }, [profile]);

      useEffect(() => {
        try { localStorage.setItem("placement_os_onboarded", onboarded ? "true" : "false"); } catch (e) {}
      }, [onboarded]);

      // Calculate Profile Parsed Data (defensively — a malformed/legacy profile should never blank the app)
      const parsedData = useMemo(() => {
        try {
          return parseProfile(profile);
        } catch (e) {
          console.error("parseProfile failed, falling back to a safe empty result:", e);
          const emptyCat = { count: 0, baseSum: 0, boost: 0, score: 0, items: [] };
          const categories = {
            "Educational Qualifications": emptyCat,
            "Internships & Work Experience": emptyCat,
            "Editorial Experience & Publications": emptyCat,
            "Extra-Curricular Activities": emptyCat,
            "Certifications & Courses": emptyCat
          };
          return {
            overallSum: 0, overallReadiness: 0, maxTotal: 500,
            classification: "Data Unavailable", tierRating: "Please re-check your profile fields",
            targetPractice: profile.targetPractice || "General Corporate",
            categories,
            tierProgress: { cgpa: 0, tier1InternshipCount: 0, tier1or2InternshipCount: 0, publicationCount: 0, leadershipCount: 0, mootCount: 0 },
            tierTargetRequirements: {}
          };
        }
      }, [profile]);

      // Complete Restart OS Function
      const handleRestart = () => {
        try {
          localStorage.removeItem("placement_os_profile");
          localStorage.removeItem("placement_os_onboarded");
        } catch (e) {}
        setProfile(defaultProfile);
        setOnboarded(false);
        setActiveTab("dashboard");
        setShowRestartModal(false);
      };

      return (
        <div className="min-h-screen flex flex-col bg-bgOffwhite text-ink selection:bg-navy-800 selection:text-white">
          
          {/* Decorative Subtle Oversized Circle in background */}
          <div className="fixed -top-40 -left-40 w-96 h-96 rounded-full bg-black/5 pointer-events-none"></div>

          {!onboarded ? (
            <Onboarding 
              profile={profile} 
              setProfile={setProfile} 
              onComplete={() => setOnboarded(true)} 
            />
          ) : (
            <div className="flex flex-col min-h-screen">
              
              {/* Header */}
              <AppHeader 
                profile={profile} 
                onOpenRestart={() => setShowRestartModal(true)} 
                onEditProfile={() => setOnboarded(false)}
              />

              <div className="flex-1 flex flex-col md:flex-row">
                
                {/* Left Persistent Sidebar */}
                <Sidebar 
                  activeTab={activeTab} 
                  setActiveTab={setActiveTab} 
                  onOpenRestart={() => setShowRestartModal(true)} 
                  onEditProfile={() => setOnboarded(false)}
                />

                {/* Main Content Workspace */}
                <main className="flex-1 p-6 md:p-8 max-w-7xl w-full mx-auto">
                  {activeTab === "dashboard" && <PlacementDashboard parsedData={parsedData} profile={profile} />}
                  {activeTab === "auditor" && <CVAuditor profile={profile} setProfile={setProfile} parsedData={parsedData} />}
                  {activeTab === "interview" && <MockInterview profile={profile} />}
                  {activeTab === "dayzero" && <DayZeroAssignments profile={profile} />}
                  {activeTab === "qualification" && <QualificationTest profile={profile} />}
                  {activeTab === "requirements" && <PracticeRequirements profile={profile} />}
                  {activeTab === "matrix" && <ConsolidatedMatrix profile={profile} />}
                </main>
              </div>

              {/* Footer */}
              <footer className="border-t border-rule p-4 text-center text-[11px] text-brandGrey uppercase font-mono">
                Placement OS • Recruiter-Readiness Matrix & Balanced Symmetrical Averaging Engine • Independent Student Peer Evaluation Tool
              </footer>
            </div>
          )}

          {/* Restart OS Confirmation Modal */}
          {showRestartModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="card p-6 max-w-md w-full space-y-4">
                <div className="flex items-center space-x-2 text-ink font-bold uppercase">
                  <Icon name="alertTriangle" className="w-5 h-5 text-ink" />
                  <span>Restart operating system?</span>
                </div>
                <p className="text-xs text-brandGrey leading-relaxed">
                  This will clear your current profile parameters, reset academic verification state, and bring you back to Step 1. Are you sure?
                </p>
                <div className="flex justify-end space-x-2 pt-2">
                  <button 
                    onClick={() => setShowRestartModal(false)}
                    className="px-4 py-2 border border-brandLightGrey rounded-lg text-xs font-semibold hover:bg-surface transition-colors"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={handleRestart}
                    className="px-4 py-2 bg-navy-800 text-white rounded-lg text-xs font-semibold hover:bg-navy-700 transition-colors"
                  >
                    Yes, Restart
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    // Render React Application
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

  </script>
</body>
</html>
