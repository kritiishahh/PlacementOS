    const normalizeText = (text) => {
      if (!text) return "";
      return text
        .toLowerCase()
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/[^\w\s]/gi, '')
        .replace(/\s+/g, ' ')
        .trim();
    };

    const levenshteinDistance = (a, b) => {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
            );
          }
        }
      }
      return matrix[b.length][a.length];
    };

    const isFuzzyMatch = (query, target) => {
      const q = normalizeText(query);
      const t = normalizeText(target);
      if (!q || !t) return false;
      if (t.includes(q) || q.includes(t)) return true;

      const qWords = q.split(' ');
      const tWords = t.split(' ');

      for (let qw of qWords) {
        if (qw.length < 3) continue;
        for (let tw of tWords) {
          if (tw.length < 3) continue;
          const maxDist = qw.length > 5 ? 2 : 1;
          if (levenshteinDistance(qw, tw) <= maxDist) return true;
        }
      }
      return false;
    };

        if (!text) return [];
        return text
          .split(/[\n;]/)
          .map(e => e.trim())
          .filter(e => e.length > 0);
      };

      // 2. Internship Parsing
      const rawInternships = splitEntries(profile.internshipsText);
      const internshipItems = rawInternships.map(entry => {
        const norm = normalizeText(entry);
        
        // Litigation Signals
        const isJudicial = /judicial|clerkship|chief public prosecutor|advocate on record|aor|senior advocate chamber|judge office/i.test(norm);
        if (isJudicial) return { name: entry, tier: "Tier 1", score: 90 };

        const isAdvocateChamber = /advocate|chamber practice|dispute|litigation|arbitration team/i.test(norm);
        
        // Match Law Firm Aliases & Master Database
        for (let aliasObj of LAW_FIRM_ALIASES) {
          for (let alias of aliasObj.aliases) {
            if (isFuzzyMatch(alias, norm)) {
              // Find tier in master company or default Tier 1/2
              const match = MASTER_COMPANIES.find(c => c.name.toLowerCase() === aliasObj.canonical.toLowerCase());
              const tier = match ? match.tier : "Tier 1";
              const score = tier === "Tier 1" ? 90 : tier === "Tier 2" ? 75 : 65;
              return { name: entry, tier, score };
            }
          }
        }

        for (let company of MASTER_COMPANIES) {
          if (isFuzzyMatch(company.name, norm)) {
            const score = company.tier === "Tier 1" ? 90 : company.tier === "Tier 2" ? 75 : 65;
            return { name: entry, tier: company.tier, score };
          }
        }

        if (isAdvocateChamber) return { name: entry, tier: "Tier 2", score: 75 };

        // Default Tier 3 if mentioned internship length/firm, else Not Tiered
        if (/internship|intern|trainee|associates|advocates|firm|chambers/i.test(norm)) {
          return { name: entry, tier: "Tier 3", score: 65 };
        }
        return { name: entry, tier: "Not Tiered", score: 50 };
      });

      // 3. Publication Parsing
      const rawPubs = splitEntries(profile.publicationsText);
      const publicationItems = rawPubs.map(entry => {
        const norm = normalizeText(entry);
        
        // Tier 1 Signals
        if (/scopus|ugc|ugc-indexed|ugc care|ugc-approved/i.test(norm)) {
          return { name: entry, tier: "Tier 1", score: 90 };
        }

        // Tier 2 Signals
        if (/harvard|yale|stanford|columbia|pennsylvania|michigan|georgetown|nlsir|nujs law review|nalsar law review|nluj law review|ijlt|jglr|vidhi|orf|brookings|carnegie|chatham house|bar & bench|livelaw/i.test(norm)) {
          return { name: entry, tier: "Tier 2", score: 75 };
        }

        // Tier 3 Signals
        if (/peer-reviewed|double-peer-reviewed|blind-peer-reviewed|specialist review|journal|law review|blog/i.test(norm)) {
          return { name: entry, tier: "Tier 3", score: 65 };
        }

        return { name: entry, tier: "Not Tiered", score: 50 };
      });

      // 4. Leadership Parsing
      const rawLeadership = splitEntries(profile.leadershipText);
      const leadershipItems = rawLeadership.map(entry => {
        const norm = normalizeText(entry);
        if (/founder|president|creator|owner/i.test(norm)) {
          return { name: entry, tier: "Tier 1", score: 90 };
        }
        if (/general secretary|treasurer|vice president/i.test(norm)) {
          return { name: entry, tier: "Tier 1", score: 80 };
        }
        if (/director|head/i.test(norm)) {
          return { name: entry, tier: "Tier 2", score: 75 };
        }
        if (/sub-head|organising committee|organizing committee|oc member|convener/i.test(norm)) {
          return { name: entry, tier: "Tier 3", score: 65 };
        }
        return { name: entry, tier: "Not Tiered", score: 50 };
      });

      // 5. Moot Court Parsing
      const rawMoots = splitEntries(profile.mootsText);
      const mootItems = rawMoots.map(entry => {
        const norm = normalizeText(entry);
        if (/jessup|vis|fdi|elmc|price|icc|international/i.test(norm)) {
          return { name: entry, tier: "Tier 1", score: 90 };
        }
        if (/nlsiu|nalsar|nujs|nlu|national/i.test(norm)) {
          return { name: entry, tier: "Tier 2", score: 75 };
        }
        return { name: entry, tier: "Tier 3", score: 65 };
      });

      // Helper to calculate category score + boosters
      const calculateCategory = (items) => {
        if (!items || items.length === 0) return { count: 0, boost: 0, score: 0, baseSum: 0, items: [] };
        const baseSum = items.reduce((acc, item) => acc + item.score, 0);

        let t1 = items.filter(i => i.tier === "Tier 1").length;
        let t2 = items.filter(i => i.tier === "Tier 2").length;
        let t3 = items.filter(i => i.tier === "Tier 3").length;
        let nt = items.filter(i => i.tier === "Not Tiered").length;

        let booster = 0;
        if (t1 >= 4) booster = 10;
        else if (t2 >= 3) booster = 7;
        else if (t3 >= 3) booster = 5;
        else if (nt >= 3) booster = 5;

        const categoryScore = Math.min(100, (baseSum + booster) / items.length);
        return {
          count: items.length,
          baseSum,
          boost: booster,
          score: categoryScore,
          items
        };
      };

      const internshipsCat = calculateCategory(internshipItems);
      const publicationsCat = calculateCategory(publicationItems);
      const leadershipCat = calculateCategory(leadershipItems);
      const mootsCat = calculateCategory(mootItems);

      const allCategories = [academicsCat, internshipsCat, publicationsCat, leadershipCat, mootsCat];
      const overallSum = allCategories.reduce((acc, c) => acc + c.score, 0);
      const overallReadiness = Math.round(overallSum / 5);

      let tierRating = "";

        tierRating = "Tier-1 Day-Zero Threshold Match";

        tierRating = "Tier-3 Boutique Level Match";

        tierRating = "Not Tiered (60 Below)";

      const concepts = TARGET_PRACTICE_CONCEPTS[targetPractice] || TARGET_PRACTICE_CONCEPTS["General Corporate"];

      // Generate exactly 10 questions dynamically based on profile
      const generateQuestions = () => {
        return [
          `Walk me through your prior experience and how it prepares you specifically for our ${targetPractice} practice at ${targetFirm}.`,
          `Your JGLS CGPA currently stands at ${profile.cgpa}/8.00. What does this tell us about your capacity to execute detailed transactional legal research under tight firm deadlines?`,
          `In ${targetPractice}, how do you evaluate the structural distinction between ${concepts.concept1} and ${concepts.concept2}?`,
          `How do you envisage legal technology or AI tools simplifying transaction due diligence or litigation research in our daily firm operations?`,
          `Discuss recent regulatory developments regarding ${concepts.news}. How does this impact high-value cross-border advisory?`,
          `If a foreign client intends to acquire a ${concepts.section}, what regulatory authorizations and filings are mandated under ${concepts.approvals}?`,
          `Walk us through a potential legal hurdle or procedural issue regarding ${concepts.concept1} under Indian jurisdiction.`,
          `In a high-stakes arbitration or commercial dispute, explain the appellate recourse available following the denial of an interim injunction.`,
          `Day-Zero roles at top-tier entities demand intense resilience. How do you maintain legal precision under heavy workload stress?`,
          `Finally, why have you specifically targeted ${targetFirm} above other Tier-1 entities for your primary corporate career objective?`
        ];
      };

      const startInterview = () => {
        const qList = generateQuestions();
        setQuestions(qList);
        setCurrentQIndex(0);
        setEvaluations([]);
        setInterviewCompleted(false);

        const initialMsg = {
          sender: "Interviewer",
          text: `Welcome to the ${targetFirm} Mock Partner Round (${targetPractice}). Let's begin immediately.\n\nQuestion 1: ${qList[0]}`,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setMessages([initialMsg]);
        setInterviewStarted(true);
      };

      // Offline Technical Evaluation Logic
      const evaluateAnswer = (answerText) => {
        const norm = normalizeText(answerText);
        const words = answerText.trim().split(/\s+/).filter(w => w.length > 0).length;

        // Technical Anchors Check
        const anchors = [
          "companies act", "fema", "sebi", "arbitration act", "bnss", "bns", "bsa", "ibc", "constitution", "nclt", "cci",
          "due diligence", "indemnity", "condition precedent", "cp", "condition subsequent", "cs", "disclosure", "clause",
          "warranty", "liability", "damages", "injunction", "seat", "venue", "arbitrator", "tribunal", "interim", "appeal",
          "jurisdiction", "memorial", "advocate", "bench"
        ];

        let technicalScore = 0;
        let matchedAnchors = [];
        for (let anchor of anchors) {
          if (norm.includes(anchor)) {
            technicalScore += 15;
            matchedAnchors.push(anchor);
          }
        }

        let wordBonus = 0;
        if (words >= 120) wordBonus = 25;
        else if (words >= 60) wordBonus = 15;

        const rawScore = 40 + technicalScore + wordBonus;
        const finalScore = Math.min(95, Math.max(30, rawScore));

        let assessment = "";
        let upgrade = "";

        if (words < 15) {
          assessment = "DAY-ZERO ASSESSMENT: Answer is excessively brief and fails to demonstrate analytical depth.";
          upgrade = "DAY-ZERO TACTICAL UPGRADE: Expand with structured legal arguments, referencing statutory provisions and commercial impact.";
        } else if (matchedAnchors.length === 0) {
          assessment = "DAY-ZERO ASSESSMENT: Demonstrates general conversational awareness but lacks technical legal terminology.";
          upgrade = "DAY-ZERO TACTICAL UPGRADE: Explicitly cite governing statutes (e.g., Companies Act, SEBI, FEMA) and transactional terms (CP/CS, Indemnity).";
        } else {
          assessment = `DAY-ZERO ASSESSMENT: Strong technical grounding. Recognized key anchors: [${matchedAnchors.slice(0, 3).join(", ")}].`;
          upgrade = "DAY-ZERO TACTICAL UPGRADE: Maintain this analytical rigor. Connect statutory terms directly to risk allocation and deal timelines.";
        }

        return { score: finalScore, assessment, upgrade, words, matchedAnchors };
      };

      const handleSend = () => {
        if (!userInput.trim()) return;

        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const userMsg = { sender: "Candidate", text: userInput, timestamp };
        
        setMessages(prev => [...prev, userMsg]);
        const currentAnswer = userInput;
        setUserInput("");
        setIsThinking(true);

        setTimeout(() => {
          const evalResult = evaluateAnswer(currentAnswer);
          setEvaluations(prev => [...prev, evalResult]);

              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setMessages(prev => [...prev, partnerMsg]);

            const finalMsg = {
              sender: "Interviewer",
              text: "That completes all 10 interview questions. Click below to view your full Recruiter Performance Scorecard.",
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setMessages(prev => [...prev, finalMsg]);
          }
          setIsThinking(false);
        }, 800);
      };

        ? Math.round(evaluations.reduce((acc, e) => acc + e.score, 0) / evaluations.length)

      return (

              <p className="text-xs text-brandGrey">Stress & Commercial Round simulator tuned to target practice area and firm expectations.</p>
            </div>
            {interviewStarted && !interviewCompleted && (
              <button 
                onClick={() => setShowExitModal(true)}
                className="border border-black px-4 py-2 text-xs font-bold uppercase hover:bg-black hover:text-white transition-colors"
              >
                Abandon Interview
              </button>
            )}
          </div>

          {!interviewStarted ? (
            <div className="bg-white border border-black p-8 space-y-6">
              <div className="space-y-2">
                <span className="text-[10px] font-bold uppercase tracking-wider text-brandGrey">Interview Configuration</span>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs font-mono">
                  <div className="p-3 bg-bgOffwhite border border-black">
                    <span className="text-brandGrey block">Target Entity</span>
                    <span className="font-bold text-black">{targetFirm}</span>
                  </div>
                  <div className="p-3 bg-bgOffwhite border border-black">
                    <span className="text-brandGrey block">Practice Area</span>
                    <span className="font-bold text-black">{targetPractice}</span>
                  </div>
                  <div className="p-3 bg-bgOffwhite border border-black">
                    <span className="text-brandGrey block">Candidate CGPA</span>
                    <span className="font-bold text-black">{profile.cgpa} / 8.00</span>
                  </div>
                </div>
              </div>

              <div className="p-4 bg-bgOffwhite border border-black text-xs space-y-2">
                <span className="font-bold uppercase text-black">Partner Round Overview:</span>
                <p className="text-brandGrey">
                  You will face exactly 10 dynamic legal and commercial questions. Each response is evaluated offline for statutory grounding, transactional terminology, and word volume.
                </p>
              </div>

              <button 
                onClick={startInterview}
                className="bg-black text-white px-6 py-3 text-xs font-bold uppercase hover:bg-neutral-800 transition-colors w-full border border-black"
              >
                Start 10-Question Partner Round
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              
              {/* Chat Interface Column */}
              <div className="md:col-span-2 bg-white border border-black flex flex-col h-[600px]">
                
                {/* Chat Header */}
                <div className="p-3 border-b border-black bg-bgOffwhite flex justify-between items-center text-xs">
                  <span className="font-bold uppercase">Commercial Round Stream ({currentQIndex + 1}/10)</span>
                  <span className="font-mono text-brandGrey">{targetFirm}</span>
                </div>

                {/* Chat Message Messages Scroll */}
                <div className="flex-1 p-4 overflow-y-auto space-y-4 font-mono text-xs">
                  {messages.map((m, idx) => (
                    <div 
                      key={idx} 
                      className={`flex flex-col ${m.sender === "Candidate" ? "items-end" : "items-start"}`}
                    >

                      <span>Interviewer is thinking...</span>
                    </div>

                {/* Chat Input Field */}

    // --- MODULE 4: CONSOLIDATED TIERS MATRIX & SEARCH ---
    const ConsolidatedMatrix = () => {
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");

      const categories = [
        "All", "Law Firms (India)", "Finance & Banking", "Oil & Energy", 
        "Pharmaceuticals & Healthcare", "Steel & Manufacturing", "Technology & IT", 
        "Consulting", "Private Equity & Venture Capital"
      ];

      const filteredResults = useMemo(() => {
        return MASTER_COMPANIES.filter(item => {
          const matchesCat = selectedCategory === "All" || item.category === selectedCategory;
          const matchesQuery = !searchQuery.trim() || isFuzzyMatch(searchQuery, item.name) || isFuzzyMatch(searchQuery, item.category);
          return matchesCat && matchesQuery;
        }).slice(0, 15);
      }, [searchQuery, selectedCategory]);

      return (
        <div className="space-y-6">
          
          <div className="bg-white border-2 border-black p-6 space-y-4">
            <div>
              <h2 className="text-xl font-bold uppercase tracking-tight text-black">Consolidated Tiers Matrix</h2>
              <p className="text-xs text-brandGrey">Searchable intelligence database across corporate sectors and law firm practice tiers.</p>
            </div>

            {/* Search Input Box */}
            <div className="flex flex-col md:flex-row gap-3">
              <div className="relative flex-1">
                <Icon name="search" className="w-4 h-4 text-brandGrey absolute left-3 top-3" />
                <input 
                  type="text"
                  className="w-full bg-bgOffwhite border border-black pl-9 pr-3 py-2 text-xs focus:outline-none font-mono"
                  placeholder="Search entity name, firm alias, or sector (e.g. AZB, Cyril Amarchand, Goldman)..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                />
              </div>

              <select 
                className="bg-bgOffwhite border border-black px-3 py-2 text-xs font-bold uppercase focus:outline-none"
                value={selectedCategory}
                onChange={e => setSelectedCategory(e.target.value)}
              >
                {categories.map((cat, i) => (
                  <option key={i} value={cat}>{cat}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Database Table Display */}
          <div className="bg-white border border-black p-6 space-y-4">
            <div className="flex justify-between items-center border-b border-black pb-2 text-xs">
              <span className="font-bold uppercase text-black">Database Results ({filteredResults.length} Matched)</span>
              <span className="text-brandGrey font-mono">Fuzzy Levenshtein Tolerance Active</span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-mono border-collapse">
                <thead>
                  <tr className="border-b border-black bg-bgOffwhite">
                    <th className="p-2.5 uppercase font-bold text-black">Entity Name</th>
                    <th className="p-2.5 uppercase font-bold text-black">Category / Practice Sector</th>
                    <th className="p-2.5 uppercase font-bold text-black">Type</th>
                    <th className="p-2.5 uppercase font-bold text-black text-right">Recruiter Tier</th>
                  </tr>
                </thead>
                <tbody className="divide-y border-rule">
                  {filteredResults.length === 0 ? (
                    <tr>
                      <td colSpan="4" className="p-6 text-center text-brandGrey italic">
                        No matching entities found. Try adjusting your search term.
                      </td>
                    </tr>
                  ) : (
                    filteredResults.map((item, idx) => (
                      <tr key={idx} className="hover:bg-bgOffwhite/50">
                        <td className="p-2.5 font-bold text-black uppercase">{item.name}</td>
                        <td className="p-2.5 text-brandGrey">{item.category}</td>
                        <td className="p-2.5 text-brandGrey">{item.type}</td>
                        <td className="p-2.5 text-right font-bold">
                          <span className={`px-2 py-0.5 text-[10px] uppercase border ${
                            item.tier === 'Tier 1' ? 'border-black bg-black text-white' :
                            item.tier === 'Tier 2' ? 'border-black bg-brandGrey text-white' :
                            'border-black text-black'
                          }`}>
                            {item.tier}
                          </span>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      );
    };

    // --- MAIN PLACEMENT OS ROOT APP ---
    const App = () => {
      // Default Initial State
      const defaultProfile = {
        fullName: "",
        studentId: "",
        programme: "5 year B.A L.L.B (Hons.)",
        studyYear: "5th Year",
        cgpa: "",
        internshipsText: "",
        mootsText: "",
        publicationsText: "",
        leadershipText: "",
        targetEmployer: "Undecided",
        targetPractice: "General Corporate"
      };

      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem("placement_os_profile");
        return saved ? JSON.parse(saved) : defaultProfile;
      });

      const [onboarded, setOnboarded] = useState(() => {
        return localStorage.getItem("placement_os_onboarded") === "true";
      });

      const [activeTab, setActiveTab] = useState("dashboard");
      const [showRestartModal, setShowRestartModal] = useState(false);

      // Persistence to LocalStorage
      useEffect(() => {
        localStorage.setItem("placement_os_profile", JSON.stringify(profile));
      }, [profile]);

      useEffect(() => {
        localStorage.setItem("placement_os_onboarded", onboarded ? "true" : "false");
      }, [onboarded]);

      // Calculate Profile Parsed Data
      const parsedData = useMemo(() => {
        return parseProfile(profile);
      }, [profile]);

      // Complete Restart OS Function
      const handleRestart = () => {
        localStorage.removeItem("placement_os_profile");
        localStorage.removeItem("placement_os_onboarded");
        setProfile(defaultProfile);
        setOnboarded(false);
        setActiveTab("dashboard");
        setShowRestartModal(false);
      };

      return (
        <div className="min-h-screen flex flex-col bg-bgOffwhite text-black selection:bg-black selection:text-white">
          
          {/* Decorative Subtle Oversized Circle in background */}
          <div className="fixed -top-40 -left-40 w-96 h-96 rounded-full bg-black/5 pointer-events-none"></div>

          {!onboarded ? (
            <Onboarding 
              profile={profile} 
              setProfile={setProfile} 
              onComplete={() => setOnboarded(true)} 
            />
          ) : (
            <div className="flex flex-col min-h-screen">
              
              {/* Header */}
              <AppHeader 
                profile={profile} 
                onOpenRestart={() => setShowRestartModal(true)} 
              />

              <div className="flex-1 flex flex-col md:flex-row">
                
                {/* Left Persistent Sidebar */}
                <Sidebar 
                  activeTab={activeTab} 
                  setActiveTab={setActiveTab} 
                  onOpenRestart={() => setShowRestartModal(true)} 
                />

                {/* Main Content Workspace */}
                <main className="flex-1 p-6 md:p-8 max-w-7xl w-full mx-auto">
                  {activeTab === "dashboard" && <PlacementDashboard parsedData={parsedData} profile={profile} />}
                  {activeTab === "auditor" && <CVAuditor profile={profile} parsedData={parsedData} />}
                  {activeTab === "interview" && <MockInterview profile={profile} />}
                  {activeTab === "matrix" && <ConsolidatedMatrix />}
                </main>
              </div>

              {/* Footer */}
              <footer className="border-t border-black p-4 text-center text-[11px] text-brandGrey uppercase font-mono">
                Placement OS • Recruiter-Readiness Matrix & Balanced Symmetrical Averaging Engine • Independent Student Peer Evaluation Tool
              </footer>
            </div>
          )}

          {/* Restart OS Confirmation Modal */}
          {showRestartModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-white border-2 border-black p-6 max-w-md w-full space-y-4">
                <div className="flex items-center space-x-2 text-black font-bold uppercase">
                  <Icon name="alertTriangle" className="w-5 h-5 text-black" />
                  <span>Restart operating system?</span>
                </div>
                <p className="text-xs text-brandGrey leading-relaxed">
                  This will clear your current profile parameters, reset academic verification state, and bring you back to Step 1. Are you sure?
                </p>
                <div className="flex justify-end space-x-2 pt-2">
                  <button 
                    onClick={() => setShowRestartModal(false)}
                    className="px-4 py-2 border border-black text-xs font-bold uppercase hover:bg-bgOffwhite"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={handleRestart}
                    className="px-4 py-2 bg-black text-white text-xs font-bold uppercase hover:bg-neutral-800"
                  >
                    Yes, Restart
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    // Render React Application
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

  </script>
</body>
</html>
